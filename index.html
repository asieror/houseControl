        function App() {
            // Estados principales
            const [currentTab, setCurrentTab] = useState('dashboard');
            const [metaTotal, setMetaTotal] = useState(DEFAULT_META_TOTAL);
            const [saldoInicial, setSaldoInicial] = useState(DEFAULT_SALDO_INICIAL);
            const [contributions, setContributions] = useState(DEFAULT_CONTRIBUTIONS);
            const [houseMetas, setHouseMetas] = useState(DEFAULT_METAS);
            const [furnitureBudget, setFurnitureBudget] = useState(DEFAULT_FURNITURE_BUDGET);
            
            // Proyección dinámica slider (Ahorro objetivo mensual conjunto)
            const [targetMonthlySaving, setTargetMonthlySaving] = useState(2300);

            // Simulación Hipoteca
            const [interestRate, setInterestRate] = useState(3.00);
            const [loanTermYears, setLoanTermYears] = useState(30);

            // Firebase setup states
            const [firebaseConfig, setFirebaseConfig] = useState(() => {
                const saved = localStorage.getItem('casa_firebase_config');
                return saved ? JSON.parse(saved) : DEFAULT_FIREBASE_CREDENTIALS;
            });
            const [firebaseStatus, setFirebaseStatus] = useState('demo');
            const [firebaseConfigForm, setFirebaseConfigForm] = useState(DEFAULT_FIREBASE_CREDENTIALS);

            // Notificaciones
            const [notifications, setNotifications] = useState([]);
            const addNotification = (message, type = 'success') => {
                const id = Date.now();
                setNotifications(prev => [...prev, { id, message, type }]);
                setTimeout(() => {
                    setNotifications(prev => prev.filter(n => n.id !== id));
                }, 4000);
            };

            const dbRef = useRef(null);
            const syncUnsubscribe = useRef(null);

            // Cargar datos locales o conectar a Firebase automáticamente al inicio
            useEffect(() => {
                if (firebaseConfig) {
                    setFirebaseConfigForm(firebaseConfig);
                    connectFirebase(firebaseConfig);
                } else {
                    loadLocalStorageData();
                }
                return () => {
                    if (syncUnsubscribe.current) syncUnsubscribe.current();
                };
            }, []);

            const loadLocalStorageData = () => {
                const localData = localStorage.getItem('casa_local_contributions');
                const localMeta = localStorage.getItem('casa_local_meta');
                const localSaldo = localStorage.getItem('casa_local_saldo');
                const localMetas = localStorage.getItem('casa_local_metas');
                const localFurniture = localStorage.getItem('casa_local_furniture');
                if (localData) setContributions(JSON.parse(localData));
                if (localMeta) setMetaTotal(parseFloat(localMeta));
                if (localSaldo) setSaldoInicial(parseFloat(localSaldo));
                if (localMetas) setHouseMetas(JSON.parse(localMetas));
                if (localFurniture) setFurnitureBudget(JSON.parse(localFurniture));
            };

            // Disparar renderizado de LaTeX cada vez que cambiamos de pestaña o de datos
            useEffect(() => {
                if (window.MathJax && window.MathJax.typesetPromise) {
                    window.MathJax.typesetPromise().catch((err) => console.log(err));
                }
            }, [currentTab, interestRate, loanTermYears, targetMonthlySaving]);

            // Conexión a Firebase utilizando el SDK compatible para evitar fallos de compilación dinámicos
            const connectFirebase = async (config) => {
                setFirebaseStatus('connecting');
                try {
                    // Verificar que las librerías globales de Firebase están listas
                    if (typeof firebase === 'undefined') {
                        throw new Error('Librerías de Firebase no cargadas aún');
                    }

                    // Evitar duplicidades de inicialización
                    let app;
                    if (!firebase.apps.length) {
                        app = firebase.initializeApp(config);
                    } else {
                        app = firebase.app();
                    }

                    const auth = firebase.auth();
                    const db = firebase.firestore();
                    dbRef.current = db;

                    // REGLA 3: Autenticación anónima inmediata
                    const userCredential = await auth.signInAnonymously();
                    const user = userCredential.user;

                    if (user) {
                        setFirebaseStatus('connected');
                        addNotification("Sincronizado con vuestro Firebase Firestore", "success");
                        
                        // REGLA 1: Usar rutas de almacenamiento estrictas
                        const appIdSlug = config.projectId || 'housecontrol-2bace';
                        const pathConfig = db.collection('artifacts').doc(appIdSlug).collection('public').doc('data').collection('config').doc('meta_config');
                        
                        // Escuchar configuraciones de la meta de ahorro
                        pathConfig.onSnapshot((docSnap) => {
                            if (!auth.currentUser) return; // Guard de autenticación
                            if (docSnap.exists) {
                                const data = docSnap.data();
                                if (data.metaTotal) setMetaTotal(data.metaTotal);
                                if (data.saldoInicial) setSaldoInicial(data.saldoInicial);
                                if (data.houseMetas) setHouseMetas(data.houseMetas);
                                if (data.furnitureBudget) setFurnitureBudget(data.furnitureBudget);
                            }
                        }, (error) => {
                            console.warn("Fallo al leer config de Firestore, usando locales");
                        });

                        // REGLA 2: Consultar la colección completa sin filtros complejos
                        const contribCollection = db.collection('artifacts').doc(appIdSlug).collection('public').doc('data').collection('contributions');
                        if (syncUnsubscribe.current) syncUnsubscribe.current();
                        
                        syncUnsubscribe.current = contribCollection.onSnapshot((querySnap) => {
                            if (!auth.currentUser) return; // Guard de autenticación
                            const list = [];
                            querySnap.forEach((doc) => {
                                list.push({ id: doc.id, ...doc.data() });
                            });
                            if (list.length > 0) {
                                // Ordenar en memoria local
                                list.sort((a, b) => (a.order || 0) - (b.order || 0));
                                setContributions(list);
                            }
                        }, (err) => {
                            console.error("Error en Snapshot de contribuciones:", err);
                        });
                    }
                } catch (error) {
                    console.error("Error al inicializar Firebase SDK:", error);
                    setFirebaseStatus('error');
                    loadLocalStorageData();
                    addNotification("Error conectando a Firebase, utilizando almacenamiento local seguro", "error");
                }
            };

            const persistData = async (updatedContribs, updatedMeta, updatedSaldo, updatedMetas, updatedFurniture) => {
                const mTotal = updatedMeta !== undefined ? updatedMeta : metaTotal;
                const sInicial = updatedSaldo !== undefined ? updatedSaldo : saldoInicial;
                const listContribs = updatedContribs !== undefined ? updatedContribs : contributions;
                const hMetas = updatedMetas !== undefined ? updatedMetas : houseMetas;
                const fBudget = updatedFurniture !== undefined ? updatedFurniture : furnitureBudget;

                if (firebaseStatus === 'connected' && dbRef.current) {
                    try {
                        const appIdSlug = firebaseConfig.projectId || 'housecontrol-2bace';
                        
                        // Guardar configuración y muebles
                        await dbRef.current.collection('artifacts').doc(appIdSlug).collection('public').doc('data').collection('config').doc('meta_config').set({
                            metaTotal: mTotal,
                            saldoInicial: sInicial,
                            houseMetas: hMetas,
                            furnitureBudget: fBudget
                        });

                        // Guardar aportaciones mensuales históricas
                        for (let i = 0; i < listContribs.length; i++) {
                            const month = listContribs[i];
                            await dbRef.current.collection('artifacts').doc(appIdSlug).collection('public').doc('data').collection('contributions').doc(month.id).set({
                                name: month.name,
                                laura: Number(month.laura),
                                asier: Number(month.asier),
                                revolut: Number(month.revolut),
                                simulacion: Number(month.simulacion),
                                order: i
                            });
                        }
                    } catch (err) {
                        console.error("Error persistiendo datos en Firebase:", err);
                    }
                } else {
                    localStorage.setItem('casa_local_contributions', JSON.stringify(listContribs));
                    localStorage.setItem('casa_local_meta', mTotal.toString());
                    localStorage.setItem('casa_local_saldo', sInicial.toString());
                    localStorage.setItem('casa_local_metas', JSON.stringify(hMetas));
                    localStorage.setItem('casa_local_furniture', JSON.stringify(fBudget));
                }
            };

            // --- CÁLCULOS DINÁMICOS DE APORTACIONES ---
            const processedData = useMemo(() => {
                let currentAccumulated = saldoInicial;
                let totalLaura = 0;
                let totalAsier = 0;
                let totalSimulacion = saldoInicial;

                const rows = contributions.map((c) => {
                    const totalMes = Number(c.laura) + Number(c.asier);
                    currentAccumulated += totalMes;
                    totalLaura += Number(c.laura);
                    totalAsier += Number(c.asier);
                    totalSimulacion += Number(c.simulacion || 0);

                    const pendiente = Math.max(0, metaTotal - currentAccumulated);
                    const d50_50 = totalLaura - totalAsier;
                    const diferenciaVsPlan = currentAccumulated - totalSimulacion;

                    return {
                        ...c,
                        totalMes,
                        acumulado: currentAccumulated,
                        pendiente,
                        diferencia50_50: d50_50,
                        totalLauraAcumulado: totalLaura,
                        totalAsierAcumulado: totalAsier,
                        simulacionAcumulado: totalSimulacion,
                        diferenciaVsPlan
                    };
                });

                const totalAhorrado = currentAccumulated;
                const porcentajeProgreso = Math.min(100, (totalAhorrado / metaTotal) * 100);
                const saldoRevolutActual = contributions.length > 0 ? Number(contributions[contributions.length - 1].revolut) : saldoInicial;

                // Cálculos del fondo de muebles
                const totalMueblesPresupuesto = furnitureBudget.reduce((sum, item) => sum + item.amount, 0);
                const totalMueblesGastado = furnitureBudget.reduce((sum, item) => sum + item.spent, 0);

                return {
                    rows,
                    totalAhorrado,
                    porcentajeProgreso,
                    totalLaura,
                    totalAsier,
                    saldoRevolutActual,
                    totalSimulacion,
                    totalMueblesPresupuesto,
                    totalMueblesGastado
                };
            }, [contributions, metaTotal, saldoInicial, furnitureBudget]);

            // --- PROYECCIONES DE TIEMPO Y CONSEJOS ---
            const projections = useMemo(() => {
                const restanteCasa = Math.max(0, metaTotal - processedData.totalAhorrado);
                const restanteMuebles = Math.max(0, processedData.totalMueblesPresupuesto - processedData.totalMueblesGastado);
                const totalRestanteProyectoCompleto = restanteCasa + restanteMuebles;

                // Promedio de ahorro real actual (últimos 3 meses como velocidad histórica)
                let actualMonthlyVelocity = 2300; 
                if (contributions.length >= 3) {
                    const last3 = contributions.slice(-3);
                    const sum = last3.reduce((s, c) => s + Number(c.laura) + Number(c.asier), 0);
                    actualMonthlyVelocity = sum / 3;
                }

                const mesesParaCasa = Math.ceil(restanteCasa / targetMonthlySaving);
                const mesesParaCompleto = Math.ceil(totalRestanteProyectoCompleto / targetMonthlySaving);

                const hoy = new Date();
                const fechaCasa = new Date(hoy.getFullYear(), hoy.getMonth() + mesesParaCasa, 1);
                const fechaCompleto = new Date(hoy.getFullYear(), hoy.getMonth() + mesesParaCompleto, 1);

                const formatOptions = { month: 'long', year: 'numeric' };
                const fechaCasaLabel = fechaCasa.toLocaleDateString('es-ES', formatOptions);
                const fechaCompletoLabel = fechaCompleto.toLocaleDateString('es-ES', formatOptions);

                return {
                    restanteCasa,
                    restanteMuebles,
                    totalRestanteProyectoCompleto,
                    actualMonthlyVelocity,
                    mesesParaCasa,
                    mesesParaCompleto,
                    fechaCasaLabel,
                    fechaCompletoLabel
                };
            }, [processedData, targetMonthlySaving, metaTotal, contributions]);

            // --- SIMULADOR HIPOTECA ---
            const hipotecaData = useMemo(() => {
                const valorVivienda = 348700;
                const prestamoHipotecario = valorVivienda * 0.8; 
                
                const r = (interestRate / 100) / 12;
                const n = loanTermYears * 12;
                
                let cuotaMensual = 0;
                if (r > 0) {
                    cuotaMensual = (prestamoHipotecario * r * Math.pow(1 + r, n)) / (Math.pow(1 + r, n) - 1);
                } else {
                    cuotaMensual = prestamoHipotecario / n;
                }

                const totalPagado = cuotaMensual * n;
                const totalIntereses = totalPagado - prestamoHipotecario;

                return {
                    valorVivienda,
                    prestamoHipotecario,
                    cuotaMensual,
                    totalPagado,
                    totalIntereses
                };
            }, [interestRate, loanTermYears]);

            // --- GESTIÓN DE EDICIONES DE MESES ---
            const [editingMonth, setEditingMonth] = useState(null);
            const [editForm, setEditForm] = useState({ name: "", laura: 0, asier: 0, revolut: 0, simulacion: 0 });

            const startEdit = (month) => {
                setEditingMonth(month.id);
                setEditForm({
                    name: month.name,
                    laura: month.laura,
                    asier: month.asier,
                    revolut: month.revolut,
                    simulacion: month.simulacion
                });
            };

            const saveEdit = () => {
                const updated = contributions.map(c => {
                    if (c.id === editingMonth) {
                        return {
                            ...c,
                            name: editForm.name,
                            laura: Number(editForm.laura),
                            asier: Number(editForm.asier),
                            revolut: Number(editForm.revolut),
                            simulacion: Number(editForm.simulacion)
                        };
                    }
                    return c;
                });
                setContributions(updated);
                setEditingMonth(null);
                persistData(updated);
                addNotification("Aportación mensual guardada");
            };

            const addNewMonth = () => {
                const nextNum = contributions.length + 1;
                const lastMonth = contributions[contributions.length - 1];
                const newMonth = {
                    id: 'm_' + Date.now(),
                    name: `Mes ${nextNum}`,
                    laura: lastMonth ? lastMonth.laura : 800,
                    asier: lastMonth ? lastMonth.asier : 1500,
                    revolut: lastMonth ? lastMonth.revolut + (lastMonth.laura + lastMonth.asier) : saldoInicial + 2300,
                    simulacion: lastMonth ? lastMonth.simulacion : 1373
                };
                const updated = [...contributions, newMonth];
                setContributions(updated);
                persistData(updated);
                addNotification("Fila de planificación mensual añadida");
            };

            const deleteMonth = (id) => {
                if (window.confirm("¿Estás seguro de que quieres eliminar este mes del historial?")) {
                    const updated = contributions.filter(c => c.id !== id);
                    setContributions(updated);

                    addNotification("Mes eliminado del histórico", "info");

            // --- GESTIÓN DE PARTIDAS DE MUEBLES ---
            const [newFurniture, setNewFurniture] = useState({ category: "", item: "", amount: 0, priority: "Media" });
            const addFurnitureItem = () => {
                if (!newFurniture.category || !newFurniture.item || !newFurniture.amount) {
                    addNotification("Completa todos los campos para añadir el mueble", "error");
                    return;
                }
                const newItem = {
                    id: 'f_' + Date.now(),
                    category: newFurniture.category,
                    item: newFurniture.item,
                    amount: Number(newFurniture.amount),
                    spent: 0,
                    status: 'Pendiente',

                const updated = [...furnitureBudget, newItem];
                setFurnitureBudget(updated);
                persistData(contributions, metaTotal, saldoInicial, houseMetas, updated);
                setNewFurniture({ category: "", item: "", amount: 0, priority: "Media" });

            const toggleFurnitureStatus = (id) => {
                const updated = furnitureBudget.map(f => {

                        const newStatus = f.status === 'Comprado' ? 'Pendiente' : 'Comprado';
                        return {
                            ...f,
                            status: newStatus,
                            spent: newStatus === 'Comprado' ? f.amount : 0

                    }
                    return f;
                });
                setFurnitureBudget(updated);
                persistData(contributions, metaTotal, saldoInicial, houseMetas, updated);
                addNotification("Estado de compra actualizado");
            };

            const updateFirebaseConfigInApp = (e) => {
                e.preventDefault();
                localStorage.setItem('casa_firebase_config', JSON.stringify(firebaseConfigForm));
                setFirebaseConfig(firebaseConfigForm);
                connectFirebase(firebaseConfigForm);

            const resetToDefaultCredentials = () => {

                setFirebaseConfigForm(DEFAULT_FIREBASE_CREDENTIALS);

            // --- CSV IMPORT UTILITIES ---
            const handleCSVUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    parseCSVData(event.target.result);
                };
                reader.readAsText(file);
            };

            const parseCSVData = (text) => {
                try {
                    const lines = text.split('\n');
                    let parsedMeta = DEFAULT_META_TOTAL;
                    let parsedSaldo = DEFAULT_SALDO_INICIAL;
                    let parsedMetas = [...DEFAULT_METAS];
                    const parsedMonthly = [];

                    lines.forEach(line => {
                        const cols = line.split(',');
                        if (cols.length < 2) return;

                        const cleanText = (str) => str ? str.trim().replace(/"/g, '') : '';
                        const cleanNum = (str) => {
                            if (!str) return 0;
                            let val = str.trim().replace(/"/g, '').replace('€', '').replace(/\s/g, '');
                            if (val.includes('.') && val.includes(',')) {
                                val = val.replace(/\./g, '').replace(',', '.');
                            } else if (val.includes(',')) {
                                val = val.replace(',', '.');
                            }
                            return parseFloat(val) || 0;
                        };

                        const label = cleanText(cols[1]);
                        const val = cols[2];

                        if (label.includes("10% Entrada Piso")) parsedMetas[0].amount = cleanNum(val);
                        else if (label.includes("IVA (Gastos)")) parsedMetas[1].amount = cleanNum(val);
                        else if (label.includes("Personalización")) parsedMetas[2].amount = cleanNum(val);
                        else if (label.includes("META TOTAL")) parsedMeta = cleanNum(val);
                        else if (label.includes("Saldo Inicial Real")) parsedSaldo = cleanNum(val);

                        const idx = parseInt(cols[0]);
                        if (!isNaN(idx) && idx > 0 && cols.length >= 6) {
                            parsedMonthly.push({
                                id: 'm_imported_' + idx + '_' + Date.now(),
                                name: cleanText(cols[1]),
                                laura: cleanNum(cols[2]),
                                asier: cleanNum(cols[3]),
                                revolut: cleanNum(cols[5]),
                                simulacion: cleanNum(cols[11]) || cleanNum(cols[4])
                            });
                        }
                    });

                    if (parsedMonthly.length > 0) {
                        setMetaTotal(parsedMeta);
                        setSaldoInicial(parsedSaldo);
                        setHouseMetas(parsedMetas);
                        setContributions(parsedMonthly);
                        persistData(parsedMonthly, parsedMeta, parsedSaldo, parsedMetas);
                        addNotification("Importación de CSV completada", "success");
                    }

                    addNotification("Error procesando CSV", "error");

            return (

                                <div class="text-[10px] text-slate-400 font-semibold uppercase">de un total necesario de {metaTotal.toLocaleString('es-ES')} €</div>

                                {SVGIcons.wallet}
                                Cuenta Conjunta Revolut

                                {SVGIcons.home}

                                            />
                                        </div>
                                    </div>

                                    {/* Resultados del Préstamo */}
                                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                                        <div class="bg-slate-900/40 p-5 rounded-2xl border border-slate-800">
                                            <span class="text-[10px] text-slate-400 font-extrabold uppercase">Importe Financiado (80%)</span>
                                            <div class="text-xl font-extrabold text-white mt-1">{hipotecaData.prestamoHipotecario.toLocaleString('es-ES')} €</div>
                                            <p class="text-[10px] text-slate-500 mt-1">Precio total estimado: {hipotecaData.valorVivienda.toLocaleString('es-ES')} €</p>
                                        </div>

                                        <div class="bg-slate-900/40 p-5 rounded-2xl border border-slate-800">
                                            <span class="text-[10px] text-slate-400 font-extrabold uppercase">Cuota Mensual Estimada</span>
                                            <div class="text-2xl font-black text-purple-400 mt-1">{hipotecaData.cuotaMensual.toLocaleString('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} €</div>
                                            <p class="text-[10px] text-slate-500 mt-1">Cuota dividida 50/50: {(hipotecaData.cuotaMensual / 2).toFixed(0)} € cada uno</p>
                                        </div>

                                        <div class="bg-slate-900/40 p-5 rounded-2xl border border-slate-800">
                                            <span class="text-[10px] text-slate-400 font-extrabold uppercase">Total Intereses a Pagar</span>
                                            <div class="text-xl font-extrabold text-white mt-1">{hipotecaData.totalIntereses.toLocaleString('es-ES', { minimumFractionDigits: 2 })} €</div>
                                            <p class="text-[10px] text-slate-500 mt-1">Coste final del préstamo: {hipotecaData.totalPagado.toLocaleString('es-ES')} €</p>
                                        </div>
                                    </div>

                                    {/* Consejos Viabilidad */}
                                    <div class="bg-slate-900/30 p-5 rounded-3xl border border-slate-800 text-xs text-slate-300 space-y-3">
                                        <h4 class="font-bold text-white uppercase tracking-wider">Regla del 30-35% de Endeudamiento Máximo</h4>
                                        <p class="leading-relaxed">
                                            Para que la hipoteca no ponga en aprietos vuestra economía familiar, la cuota mensual calculada de <strong class="text-purple-400">{hipotecaData.cuotaMensual.toFixed(0)} €</strong> no debería superar el <strong class="text-white">30% de vuestros ingresos netos mensuales conjuntos</strong>.
                                        </p>
                                        <div class="p-3 bg-slate-950 rounded-xl border border-slate-900 flex justify-between font-bold">
                                            <span>Ingresos netos de pareja mínimos sugeridos:</span>
                                            <span class="text-purple-400">{(hipotecaData.cuotaMensual / 0.3).toLocaleString('es-ES', { maximumFractionDigits: 0 })} € / mes</span>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* PESTAÑA: CONFIGURACIÓN Y SINCRONIZACIÓN NUBE */}
                            {currentTab === 'config' && (
                                <div class="space-y-6 animate-fadeIn">
                                    <div class="bg-slate-900 border border-slate-800 rounded-3xl p-5 space-y-4 shadow-xl">
                                        <div class="flex items-center justify-between">
                                            <h3 class="font-bold text-white text-sm">Configurar Sincronización en la Nube (Firebase)</h3>
                                            <button onClick={resetToDefaultCredentials} class="text-xs text-rose-400 hover:underline">Restaurar Originales</button>
                                        </div>
                                        <p class="text-xs text-slate-400 leading-relaxed">
                                            La aplicación utiliza las credenciales que has facilitado para conectar de manera segura con tu base de datos de <strong>housecontrol-2bace</strong> de forma gratuita.
                                        </p>
                                        <form onSubmit={updateFirebaseConfigInApp} class="space-y-3 text-xs">
                                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                                <div>
                                                    <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">apiKey</label>
                                                    <input type="text" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white font-mono text-[11px]" value={firebaseConfigForm.apiKey} onChange={e => setFirebaseConfigForm({...firebaseConfigForm, apiKey: e.target.value})} />
                                                </div>
                                                <div>
                                                    <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">projectId</label>
                                                    <input type="text" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white font-mono text-[11px]" value={firebaseConfigForm.projectId} onChange={e => setFirebaseConfigForm({...firebaseConfigForm, projectId: e.target.value})} />
                                                </div>
                                            </div>
                                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                                <div>
                                                    <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">authDomain</label>
                                                    <input type="text" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white font-mono text-[11px]" value={firebaseConfigForm.authDomain} onChange={e => setFirebaseConfigForm({...firebaseConfigForm, authDomain: e.target.value})} />
                                                </div>
                                                <div>
                                                    <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">appId</label>
                                                    <input type="text" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-white font-mono text-[11px]" value={firebaseConfigForm.appId} onChange={e => setFirebaseConfigForm({...firebaseConfigForm, appId: e.target.value})} />
                                                </div>
                                            </div>
                                            <button type="submit" class="w-full bg-cyan-600 hover:bg-cyan-500 text-white text-xs font-bold py-2.5 rounded-xl transition shadow-lg shadow-cyan-600/20">
                                                Reconectar Base de Datos
                                            </button>
                                        </form>
                                    </div>

                                    {/* Importar Respaldos */}
                                    <div class="bg-slate-900 border border-slate-800 rounded-3xl p-5 space-y-4 shadow-xl">
                                        <h3 class="font-bold text-white text-sm">Carga vuestro Excel a Firebase (Respaldos .CSV)</h3>
                                        <p class="text-xs text-slate-400 leading-relaxed">
                                            Sube tu archivo de simulación en formato CSV para actualizar de forma inmediata todas las aportaciones históricas de Laura y Asier en vuestra nube de Firebase Firestore.
                                        </p>
                                        <div class="flex items-center gap-3">
                                            <input type="file" accept=".csv" onChange={handleCSVUpload} id="csvFileInput" class="hidden" />
                                            <label htmlFor="csvFileInput" class="cursor-pointer bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold px-4 py-2.5 rounded-xl transition shadow-lg shadow-emerald-500/20">
                                                Subir Archivo CSV de Cuentas
                                            </label>
                                        </div>
                                    </div>
                                </div>
                            )}

                        </div>
                    </main>

                    {/* PIE DE PÁGINA */}
                    <footer class="bg-slate-900 border-t border-slate-800/80 py-5 text-center text-[10px] text-slate-500 mt-auto uppercase tracking-wider font-semibold">
                        <p>© 2026 Panel de Control Financiero Familiar de Laura y Asier.</p>
                    </footer>
                </div>
            );
        }

        // --- SUBCOMPONENTE DE GRÁFICO VECTORIAL (SVG) EXTREMADAMENTE SEGURO Y COMPATIBLE ---
        function ResponsiveSVGChart({ rows, metaTotal }) {
            if (!rows || rows.length === 0) return null;

            const width = 600;
            const height = 180;
            const padding = 30;

            const maxVal = Math.max(...rows.map(r => Math.max(r.acumulado, r.simulacionAcumulado, metaTotal))) * 1.1;
            const minVal = 0;

            // Coordenadas calculadas para la línea "Real" y "Simulación"
            const pointsReal = rows.map((r, i) => {
                const x = padding + (i / (rows.length - 1)) * (width - padding * 2);
                const y = height - padding - ((r.acumulado - minVal) / (maxVal - minVal)) * (height - padding * 2);
                return { x, y, val: r.acumulado, name: r.name };
            });

            const pointsSim = rows.map((r, i) => {
                const x = padding + (i / (rows.length - 1)) * (width - padding * 2);
                const y = height - padding - ((r.simulacionAcumulado - minVal) / (maxVal - minVal)) * (height - padding * 2);
                return { x, y, val: r.simulacionAcumulado };
            });

            // Generar los comandos d="" para dibujar el path
            const pathRealD = pointsReal.map((p, i) => `${i === 0 ? 'M' : 'L'} ${p.x} ${p.y}`).join(' ');
            const pathSimD = pointsSim.map((p, i) => `${i === 0 ? 'M' : 'L'} ${p.x} ${p.y}`).join(' ');

            // Área sombreada para el progreso real
            const areaRealD = `${pathRealD} L ${pointsReal[pointsReal.length - 1].x} ${height - padding} L ${pointsReal[0].x} ${height - padding} Z`;

            return (
                <div class="relative w-full">
                    <svg viewBox={`0 0 ${width} ${height}`} class="w-full h-auto text-slate-700">
                        {/* Líneas de cuadrícula horizontales */}
                        {[0, 0.25, 0.5, 0.75, 1].map((ratio, idx) => {
                            const y = padding + ratio * (height - padding * 2);
                            const valLabel = Math.round(maxVal - ratio * (maxVal - minVal));
                            return (
                                <g key={idx}>
                                    <line x1={padding} y1={y} x2={width - padding} y2={y} stroke="rgba(51, 65, 85, 0.15)" strokeWidth="1" />
                                    <text x={padding - 5} y={y + 3} fill="#475569" fontSize="8" fontWeight="bold" textAnchor="end">
                                        {valLabel.toLocaleString('es-ES')}
                                    </text>
                                </g>
                            );
                        })}

                        {/* Relleno de área de Ahorro Real */}
                        <path d={areaRealD} fill="url(#realGradient)" opacity="0.12" />

                        {/* Línea Simulación Planificada (Dashed) */}
                        <path d={pathSimD} fill="none" stroke="#6366f1" strokeWidth="2" strokeDasharray="3,3" />

                        {/* Línea Ahorro Real (Sólida) */}
                        <path d={pathRealD} fill="none" stroke="#0ea5e9" strokeWidth="3" strokeLinecap="round" />

                        {/* Puntos sobre el ahorro real */}
                        {pointsReal.map((p, i) => (
                            <g key={i} class="group cursor-pointer">
                                <circle cx={p.x} cy={p.y} r="3.5" fill="#0ea5e9" stroke="#0f172a" strokeWidth="1.5" />
                                <circle cx={p.x} cy={p.y} r="8" fill="transparent" />
                                <title>{`${p.name}: ${Math.round(p.val).toLocaleString('es-ES')} €`}</title>
                            </g>
                        ))}

                        {/* Etiquetas del eje X (Meses abreviados) */}
                        {pointsReal.filter((_, idx) => idx % 2 === 0).map((p, idx) => (
                            <text key={idx} x={p.x} y={height - 8} fill="#64748b" fontSize="8" fontWeight="bold" textAnchor="middle">
                                {p.name.split(' ')[0]}
                            </text>
                        ))}

                        {/* Definiciones de gradientes */}
                        <defs>
                            <linearGradient id="realGradient" x1="0" y1="0" x2="0" y2="1">
                                <stop offset="0%" stopColor="#0ea5e9" />
                                <stop offset="100%" stopColor="transparent" />
                            </linearGradient>
                        </defs>
                    </svg>
                </div>
            );
        }

        // Renderizado inicial
        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>
</html>

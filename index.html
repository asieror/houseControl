        function App() {
            // --- ESTADOS DE CONTROL Y CONFIGURACIÓN ---
            const [currentTab, setCurrentTab] = useState('dashboard');

            const [user, setUser] = useState(null);

            const [isAuthenticated, setIsAuthenticated] = useState(false);
            const [loginPinInput, setLoginPinInput] = useState("");
            const [loginError, setLoginError] = useState("");

            // Proyección dinámica
            const [targetMonthlySaving, setTargetMonthlySaving] = useState(2300);

            // Simulación Hipoteca
            const [interestRate, setInterestRate] = useState(3.00);
            const [loanTermYears, setLoanTermYears] = useState(30);

            // Firebase setup states
            const [firebaseConfig, setFirebaseConfig] = useState(() => {
                const saved = localStorage.getItem('casa_firebase_config');
                return saved ? JSON.parse(saved) : DEFAULT_FIREBASE_CREDENTIALS;
            });
            const [firebaseStatus, setFirebaseStatus] = useState('demo');
            const [firebaseConfigForm, setFirebaseConfigForm] = useState(DEFAULT_FIREBASE_CREDENTIALS);
            const [firebaseError, setFirebaseError] = useState(null);

            // Notificaciones
            const [notifications, setNotifications] = useState([]);
            const addNotification = (message, type = 'success') => {
                const id = Date.now();
                setNotifications(prev => [...prev, { id, message, type }]);
                setTimeout(() => {
                    setNotifications(prev => prev.filter(n => n.id !== id));
                }, 4000);
            };

            const dbRef = useRef(null);
            const syncUnsubscribe = useRef(null);

            // Reloj para actualización pasiva de intereses en "tiempo real"
            useEffect(() => {
                const interval = setInterval(() => {
                    setLiveSeconds(prev => prev + 1);
                }, 1000);
                return () => clearInterval(interval);
            }, []);

            // Cargar datos locales o conectar a Firebase automáticamente al inicio
            useEffect(() => {
                if (firebaseConfig) {
                    setFirebaseConfigForm(firebaseConfig);
                    connectFirebase(firebaseConfig);
                } else {
                    loadLocalStorageData();
                }
                return () => {
                    if (syncUnsubscribe.current) syncUnsubscribe.current();
                };
            }, []);

            const loadLocalStorageData = () => {
                const localData = localStorage.getItem('casa_local_contributions');
                const localMeta = localStorage.getItem('casa_local_meta');
                const localSaldo = localStorage.getItem('casa_local_saldo');
                const localMetas = localStorage.getItem('casa_local_metas');
                const localFurniture = localStorage.getItem('casa_local_furniture');
                
                const localCorr = localStorage.getItem('casa_local_revolut_correction');
                const localReason = localStorage.getItem('casa_local_revolut_reason');
                const localIntRate = localStorage.getItem('casa_local_revolut_intrate');
                const localRecDate = localStorage.getItem('casa_local_revolut_recdate');
                const localEmails = localStorage.getItem('casa_local_allowed_emails');
                const localPin = localStorage.getItem('casa_local_family_pin');

                if (localData) setContributions(JSON.parse(localData));
                if (localMeta) setMetaTotal(parseFloat(localMeta));
                if (localSaldo) setSaldoInicial(parseFloat(localSaldo));
                if (localMetas) setHouseMetas(JSON.parse(localMetas));
                if (localFurniture) setFurnitureBudget(JSON.parse(localFurniture));

                if (localCorr) setRevolutCorrection(parseFloat(localCorr));
                if (localReason) setRevolutCorrectionReason(localReason);
                if (localIntRate) setDailyInterestRate(parseFloat(localIntRate));
                if (localRecDate) setReconciliationDate(localRecDate);
                if (localEmails) setAllowedEmails(JSON.parse(localEmails));
                if (localPin) setFamilyPin(localPin);
            };

            // Conexión a Firebase utilizando el SDK compatible para evitar fallos de compilación dinámicos
            const connectFirebase = async (config) => {
                setFirebaseStatus('connecting');
                setFirebaseError(null);
                try {
                    if (typeof firebase === 'undefined') {
                        throw new Error('Las librerías de Firebase no están cargadas aún.');
                    }

                    let app;
                    if (!firebase.apps.length) {
                        app = firebase.initializeApp(config);
                    } else {
                        app = firebase.app();
                    }

                    const auth = firebase.auth();
                    const db = firebase.firestore();
                    dbRef.current = db;

                    // Escuchar estado de autenticación de Firebase
                    auth.onAuthStateChanged((firebaseUser) => {
                        if (firebaseUser) {
                            if (firebaseUser.email) {
                                if (allowedEmails.includes(firebaseUser.email.toLowerCase())) {
                                    setUser(firebaseUser);
                                    setUserEmail(firebaseUser.email);
                                    setIsAuthenticated(true);
                                    setFirebaseStatus('connected');
                                } else {
                                    setLoginError(`El email ${firebaseUser.email} no está en la lista de autorizados.`);
                                    auth.signOut();
                                    setIsAuthenticated(false);
                                    setUser(null);
                                }
                            } else {
                                setUser(firebaseUser);
                                setIsAuthenticated(true);
                                setFirebaseStatus('connected');
                            }
                        } else {
                            setUser(null);
                            setIsAuthenticated(false);
                        }
                    });

                    // REGLA 1: Usar rutas de almacenamiento estrictas para config general
                    const appIdSlug = config.projectId || 'housecontrol-2bace';
                    const pathConfig = db.collection('artifacts').doc(appIdSlug).collection('public').doc('data').collection('config').doc('meta_config');
                    
                    pathConfig.onSnapshot((docSnap) => {
                        if (docSnap.exists) {
                            const data = docSnap.data();
                            if (data.metaTotal) setMetaTotal(data.metaTotal);
                            if (data.saldoInicial) setSaldoInicial(data.saldoInicial);
                            if (data.houseMetas) setHouseMetas(data.houseMetas);
                            if (data.furnitureBudget) setFurnitureBudget(data.furnitureBudget);
                            if (data.revolutCorrection !== undefined) setRevolutCorrection(data.revolutCorrection);
                            if (data.revolutCorrectionReason !== undefined) setRevolutCorrectionReason(data.revolutCorrectionReason);
                            if (data.dailyInterestRate !== undefined) setDailyInterestRate(data.dailyInterestRate);
                            if (data.reconciliationDate !== undefined) setReconciliationDate(data.reconciliationDate);
                            if (data.allowedEmails !== undefined) setAllowedEmails(data.allowedEmails);
                            if (data.familyPin !== undefined) setFamilyPin(data.familyPin);
                        }
                    }, (error) => {
                        console.warn("Fallo al leer config de Firestore, usando locales", error);
                    });

                    // REGLA 2: Consultar la colección completa sin filtros complejos
                    const contribCollection = db.collection('artifacts').doc(appIdSlug).collection('public').doc('data').collection('contributions');
                    if (syncUnsubscribe.current) syncUnsubscribe.current();
                    
                    syncUnsubscribe.current = contribCollection.onSnapshot((querySnap) => {
                        const list = [];
                        querySnap.forEach((doc) => {
                            list.push({ id: doc.id, ...doc.data() });
                        });
                        if (list.length > 0) {
                            list.sort((a, b) => (a.order || 0) - (b.order || 0));
                            setContributions(list);
                        }
                    }, (err) => {
                        console.error("Error en Snapshot de contribuciones:", err);
                        setFirebaseError("Firestore bloqueado. Activa el 'Modo de prueba' en las Reglas de tu base de datos.");
                    });

                } catch (error) {
                    console.error("Error al inicializar Firebase SDK:", error);
                    setFirebaseStatus('error');
                    setFirebaseError(error.message || String(error));
                    loadLocalStorageData();
                    addNotification("Error conectando a Firebase, utilizando almacenamiento local seguro", "error");
                }
            };

            const persistData = async (updatedContribs, updatedMeta, updatedSaldo, updatedMetas, updatedFurniture, updatedCorr, updatedReason, updatedIntRate, updatedRecDate, updatedEmails, updatedPin) => {
                const mTotal = updatedMeta !== undefined ? updatedMeta : metaTotal;
                const sInicial = updatedSaldo !== undefined ? updatedSaldo : saldoInicial;
                const listContribs = updatedContribs !== undefined ? updatedContribs : contributions;
                const hMetas = updatedMetas !== undefined ? updatedMetas : houseMetas;
                const fBudget = updatedFurniture !== undefined ? updatedFurniture : furnitureBudget;
                
                const rCorr = updatedCorr !== undefined ? updatedCorr : revolutCorrection;
                const rReason = updatedReason !== undefined ? updatedReason : revolutCorrectionReason;
                const dRate = updatedIntRate !== undefined ? updatedIntRate : dailyInterestRate;
                const rDate = updatedRecDate !== undefined ? updatedRecDate : reconciliationDate;
                const aEmails = updatedEmails !== undefined ? updatedEmails : allowedEmails;
                const fPin = updatedPin !== undefined ? updatedPin : familyPin;

                if (firebaseStatus === 'connected' && dbRef.current) {
                    try {
                        const appIdSlug = firebaseConfig.projectId || 'housecontrol-2bace';
                        
                        await dbRef.current.collection('artifacts').doc(appIdSlug).collection('public').doc('data').collection('config').doc('meta_config').set({
                            metaTotal: mTotal,
                            saldoInicial: sInicial,
                            houseMetas: hMetas,
                            furnitureBudget: fBudget,
                            revolutCorrection: rCorr,
                            revolutCorrectionReason: rReason,
                            dailyInterestRate: dRate,
                            reconciliationDate: rDate,
                            allowedEmails: aEmails,
                            familyPin: fPin
                        });

                        for (let i = 0; i < listContribs.length; i++) {
                            const month = listContribs[i];
                            await dbRef.current.collection('artifacts').doc(appIdSlug).collection('public').doc('data').collection('contributions').doc(month.id).set({
                                name: month.name,
                                laura: Number(month.laura),
                                asier: Number(month.asier),
                                revolut: Number(month.revolut),
                                simulacion: Number(month.simulacion),
                                order: i
                            });
                        }
                    } catch (err) {
                        console.error("Error persistiendo datos en Firebase:", err);
                    }
                } else {
                    localStorage.setItem('casa_local_contributions', JSON.stringify(listContribs));
                    localStorage.setItem('casa_local_meta', mTotal.toString());
                    localStorage.setItem('casa_local_saldo', sInicial.toString());
                    localStorage.setItem('casa_local_metas', JSON.stringify(hMetas));
                    localStorage.setItem('casa_local_furniture', JSON.stringify(fBudget));

                    localStorage.setItem('casa_local_revolut_correction', rCorr.toString());
                    localStorage.setItem('casa_local_revolut_reason', rReason);
                    localStorage.setItem('casa_local_revolut_intrate', dRate.toString());
                    localStorage.setItem('casa_local_revolut_recdate', rDate);
                    localStorage.setItem('casa_local_allowed_emails', JSON.stringify(aEmails));
                    localStorage.setItem('casa_local_family_pin', fPin);
                }
            };

            // Login por Google
            const loginWithGoogle = () => {
                setLoginError("");
                if (typeof firebase === 'undefined') {
                    setLoginError("Las librerías de Firebase no están listas.");
                    return;
                }
                const provider = new firebase.auth.GoogleAuthProvider();
                firebase.auth().signInWithPopup(provider)
                    .then((result) => {
                        const email = result.user.email ? result.user.email.toLowerCase() : "";
                        if (allowedEmails.includes(email)) {
                            setUser(result.user);
                            setUserEmail(result.user.email);
                            setIsAuthenticated(true);
                            addNotification(`¡Bienvenido/a, ${result.user.displayName || 'Pareja'}!`);
                        } else {
                            setLoginError(`El email ${result.user.email} no está autorizado.`);
                            firebase.auth().signOut();
                            setIsAuthenticated(false);
                            setUser(null);
                        }
                    })
                    .catch((err) => {
                        console.error(err);
                        setLoginError(`Fallo al iniciar sesión: ${err.message}. Recuerda activar el inicio de sesión por Google en tu consola Firebase.`);
                    });
            };

            // Login por PIN
            const handlePinLogin = (e) => {
                e.preventDefault();
                setLoginError("");
                if (loginPinInput === familyPin) {
                    setIsAuthenticated(true);
                    addNotification("Acceso autorizado con éxito");
                    if (firebaseStatus !== 'connected' && dbRef.current) {
                        firebase.auth().signInAnonymously().catch(err => console.log("Anónimo omitido:", err));
                    }
                } else {
                    setLoginError("PIN incorrecto. Vuelve a intentarlo.");
                }
            };

            const logout = () => {
                if (typeof firebase !== 'undefined' && firebase.auth) {
                    firebase.auth().signOut();
                }
                setUser(null);
                setIsAuthenticated(false);
                setLoginPinInput("");
                setLoginError("");
                addNotification("Sesión cerrada", "info");
            };

            const uploadCurrentDataToFirebase = async () => {
                if (!dbRef.current) {
                    addNotification("No conectado a Firebase.", "error");
                    return;
                }
                try {
                    addNotification("Sincronizando datos con la Nube...", "info");
                    await persistData(contributions, metaTotal, saldoInicial, houseMetas, furnitureBudget);
                    addNotification("¡Todos tus datos han sido sincronizados y guardados en Firebase!", "success");
                } catch (err) {
                    console.error("Error al inicializar base de datos:", err);
                    addNotification("Error al escribir datos. Revisa las reglas de seguridad de Firestore.", "error");
                }
            };

            // --- CÁLCULOS DINÁMICOS DE APORTACIONES E INTERESES ---
            const processedData = useMemo(() => {
                let currentAccumulated = saldoInicial;
                let totalLaura = 0;
                let totalAsier = 0;
                let totalSimulacion = saldoInicial;

                const rows = contributions.map((c) => {
                    const totalMes = Number(c.laura) + Number(c.asier);
                    currentAccumulated += totalMes;
                    totalLaura += Number(c.laura);
                    totalAsier += Number(c.asier);
                    totalSimulacion += Number(c.simulacion || 0);

                    const pendiente = Math.max(0, metaTotal - currentAccumulated);
                    const d50_50 = totalLaura - totalAsier;
                    const diferenciaVsPlan = currentAccumulated - totalSimulacion;

                    return {
                        ...c,
                        totalMes,
                        acumulado: currentAccumulated,
                        pendiente,
                        diferencia50_50: d50_50,
                        totalLauraAcumulado: totalLaura,
                        totalAsierAcumulado: totalAsier,
                        simulacionAcumulado: totalSimulacion,
                        diferenciaVsPlan
                    };
                });

                const totalAhorrado = currentAccumulated;
                const porcentajeProgreso = Math.min(100, (totalAhorrado / metaTotal) * 100);
                
                const lastMonthRevolutBase = contributions.length > 0 ? Number(contributions[contributions.length - 1].revolut) : saldoInicial;

                // Calcular intereses acumulados desde el día de la conciliación hasta HOY
                const lastDate = new Date(reconciliationDate || "2026-06-01");
                const today = new Date();
                const diffTime = Math.max(0, today - lastDate);
                const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
                const accumulatedInterestRealTime = diffDays * dailyInterestRate;

                // Saldo Revolut final aplicando intereses diarios y correctivo manual
                const saldoRevolutActual = lastMonthRevolutBase + revolutCorrection + accumulatedInterestRealTime;

                // Muebles
                const totalMueblesPresupuesto = furnitureBudget.reduce((sum, item) => sum + item.amount, 0);
                const totalMueblesGastado = furnitureBudget.reduce((sum, item) => sum + item.spent, 0);

                return {
                    rows,
                    totalAhorrado,
                    porcentajeProgreso,
                    totalLaura,
                    totalAsier,
                    lastMonthRevolutBase,
                    accumulatedInterestRealTime,
                    diffDays,
                    saldoRevolutActual,
                    totalSimulacion,
                    totalMueblesPresupuesto,
                    totalMueblesGastado
                };
            }, [contributions, metaTotal, saldoInicial, furnitureBudget, reconciliationDate, dailyInterestRate, revolutCorrection, liveSeconds]);

            // --- PROYECCIONES DE TIEMPO Y CONSEJOS ---
            const projections = useMemo(() => {
                const restanteCasa = Math.max(0, metaTotal - processedData.totalAhorrado);
                const restanteMuebles = Math.max(0, processedData.totalMueblesPresupuesto - processedData.totalMueblesGastado);
                const totalRestanteProyectoCompleto = restanteCasa + restanteMuebles;

                let actualMonthlyVelocity = 2300; 
                if (contributions.length >= 3) {
                    const last3 = contributions.slice(-3);
                    const sum = last3.reduce((s, c) => s + Number(c.laura) + Number(c.asier), 0);
                    actualMonthlyVelocity = sum / 3;
                }

                const mesesParaCasa = Math.ceil(restanteCasa / targetMonthlySaving);
                const mesesParaCompleto = Math.ceil(totalRestanteProyectoCompleto / targetMonthlySaving);

                const hoy = new Date();
                const fechaCasa = new Date(hoy.getFullYear(), hoy.getMonth() + mesesParaCasa, 1);
                const fechaCompleto = new Date(hoy.getFullYear(), hoy.getMonth() + mesesParaCompleto, 1);

                const formatOptions = { month: 'long', year: 'numeric' };
                const fechaCasaLabel = fechaCasa.toLocaleDateString('es-ES', formatOptions);
                const fechaCompletoLabel = fechaCompleto.toLocaleDateString('es-ES', formatOptions);

                return {
                    restanteCasa,
                    restanteMuebles,
                    totalRestanteProyectoCompleto,
                    actualMonthlyVelocity,
                    mesesParaCasa,
                    mesesParaCompleto,
                    fechaCasaLabel,
                    fechaCompletoLabel
                };
            }, [processedData, targetMonthlySaving, metaTotal, contributions]);

            // --- SIMULADOR HIPOTECA ---
            const hipotecaData = useMemo(() => {
                const valorVivienda = 348700;
                const prestamoHipotecario = valorVivienda * 0.8; 
                
                const r = (interestRate / 100) / 12;
                const n = loanTermYears * 12;
                
                let cuotaMensual = 0;
                if (r > 0) {
                    cuotaMensual = (prestamoHipotecario * r * Math.pow(1 + r, n)) / (Math.pow(1 + r, n) - 1);
                } else {
                    cuotaMensual = prestamoHipotecario / n;
                }

                const totalPagado = cuotaMensual * n;
                const totalIntereses = totalPagado - prestamoHipotecario;

                return {
                    valorVivienda,
                    prestamoHipotecario,
                    cuotaMensual,
                    totalPagado,
                    totalIntereses
                };
            }, [interestRate, loanTermYears]);

            // --- GESTIÓN DE EDICIONES DE MESES ---
            const [editingMonth, setEditingMonth] = useState(null);
            const [editForm, setEditForm] = useState({ name: "", laura: 0, asier: 0, revolut: 0, simulacion: 0 });

            const startEdit = (month) => {
                setEditingMonth(month.id);
                setEditForm({
                    name: month.name,
                    laura: month.laura,
                    asier: month.asier,
                    revolut: month.revolut,
                    simulacion: month.simulacion
                });
            };

            const saveEdit = () => {
                const updated = contributions.map(c => {
                    if (c.id === editingMonth) {
                        return {
                            ...c,
                            name: editForm.name,
                            laura: Number(editForm.laura),
                            asier: Number(editForm.asier),
                            revolut: Number(editForm.revolut),
                            simulacion: Number(editForm.simulacion)
                        };
                    }
                    return c;
                });
                setContributions(updated);
                setEditingMonth(null);
                persistData(updated);
                addNotification("Aportación mensual guardada");
            };

            const addNewMonth = () => {
                const nextNum = contributions.length + 1;
                const lastMonth = contributions[contributions.length - 1];
                const newMonth = {
                    id: 'm_' + Date.now(),
                    name: `Mes ${nextNum}`,
                    laura: lastMonth ? lastMonth.laura : 800,
                    asier: lastMonth ? lastMonth.asier : 1500,
                    revolut: lastMonth ? lastMonth.revolut + (lastMonth.laura + lastMonth.asier) : saldoInicial + 2300,
                    simulacion: lastMonth ? lastMonth.simulacion : 1373
                };
                const updated = [...contributions, newMonth];
                setContributions(updated);
                persistData(updated);
                addNotification("Fila de planificación mensual añadida");
            };

            const deleteMonth = (id) => {
                if (window.confirm("¿Estás seguro de que quieres eliminar este mes del historial?")) {
                    const updated = contributions.filter(c => c.id !== id);
                    setContributions(updated);
                    persistData(updated);
                    addNotification("Mes eliminado del histórico", "info");
                }
            };

            // --- GESTIÓN DE PARTIDAS DE MUEBLES ---
            const [newFurniture, setNewFurniture] = useState({ category: "", item: "", amount: 0, priority: "Media" });
            const addFurnitureItem = () => {
                if (!newFurniture.category || !newFurniture.item || !newFurniture.amount) {
                    addNotification("Completa todos los campos para añadir el mueble", "error");
                    return;
                }
                const newItem = {
                    id: 'f_' + Date.now(),
                    category: newFurniture.category,
                    item: newFurniture.item,
                    amount: Number(newFurniture.amount),
                    spent: 0,
                    status: 'Pendiente',
                    priority: newFurniture.priority
                };
                const updated = [...furnitureBudget, newItem];
                setFurnitureBudget(updated);
                persistData(contributions, metaTotal, saldoInicial, houseMetas, updated);
                setNewFurniture({ category: "", item: "", amount: 0, priority: "Media" });
                addNotification("Partida de mueble añadida con éxito");
            };

            const deleteFurnitureItem = (id) => {
                const updated = furnitureBudget.filter(f => f.id !== id);
                setFurnitureBudget(updated);
                persistData(contributions, metaTotal, saldoInicial, houseMetas, updated);
                addNotification("Partida presupuestaria eliminada");
            };

            const toggleFurnitureStatus = (id) => {
                const updated = furnitureBudget.map(f => {
                    if (f.id === id) {
                        const newStatus = f.status === 'Comprado' ? 'Pendiente' : 'Comprado';
                        return {
                            ...f,
                            status: newStatus,
                            spent: newStatus === 'Comprado' ? f.amount : 0
                        };
                    }
                    return f;
                });
                setFurnitureBudget(updated);
                persistData(contributions, metaTotal, saldoInicial, houseMetas, updated);
                addNotification("Estado de compra actualizado");
            };

            const updateFirebaseConfigInApp = (e) => {
                e.preventDefault();
                localStorage.setItem('casa_firebase_config', JSON.stringify(firebaseConfigForm));
                setFirebaseConfig(firebaseConfigForm);
                connectFirebase(firebaseConfigForm);
            };

            const resetToDefaultCredentials = () => {
                localStorage.removeItem('casa_firebase_config');
                setFirebaseConfigForm(DEFAULT_FIREBASE_CREDENTIALS);
                setFirebaseConfig(DEFAULT_FIREBASE_CREDENTIALS);
                connectFirebase(DEFAULT_FIREBASE_CREDENTIALS);
                addNotification("Restaurado a credenciales por defecto", "info");
            };

            // --- CSV IMPORT UTILITIES ---
            const handleCSVUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    parseCSVData(event.target.result);
                };
                reader.readAsText(file);
            };

            const parseCSVData = (text) => {
                try {
                    const lines = text.split('\n');
                    let parsedMeta = DEFAULT_META_TOTAL;
                    let parsedSaldo = DEFAULT_SALDO_INICIAL;
                    let parsedMetas = [...DEFAULT_METAS];
                    const parsedMonthly = [];

                    lines.forEach(line => {
                        const cols = line.split(',');
                        if (cols.length < 2) return;

                        const cleanText = (str) => str ? str.trim().replace(/"/g, '') : '';
                        const cleanNum = (str) => {
                            if (!str) return 0;
                            let val = str.trim().replace(/"/g, '').replace('€', '').replace(/\s/g, '');
                            if (val.includes('.') && val.includes(',')) {
                                val = val.replace(/\./g, '').replace(',', '.');
                            } else if (val.includes(',')) {
                                val = val.replace(',', '.');
                            }
                            return parseFloat(val) || 0;
                        };

                        const label = cleanText(cols[1]);
                        const val = cols[2];

                        if (label.includes("10% Entrada Piso")) parsedMetas[0].amount = cleanNum(val);
                        else if (label.includes("IVA (Gastos)")) parsedMetas[1].amount = cleanNum(val);
                        else if (label.includes("Personalización")) parsedMetas[2].amount = cleanNum(val);
                        else if (label.includes("META TOTAL")) parsedMeta = cleanNum(val);
                        else if (label.includes("Saldo Inicial Real")) parsedSaldo = cleanNum(val);

                        const idx = parseInt(cols[0]);
                        if (!isNaN(idx) && idx > 0 && cols.length >= 6) {
                            parsedMonthly.push({
                                id: 'm_imported_' + idx + '_' + Date.now(),
                                name: cleanText(cols[1]),
                                laura: cleanNum(cols[2]),
                                asier: cleanNum(cols[3]),
                                revolut: cleanNum(cols[5]),
                                simulacion: cleanNum(cols[11]) || cleanNum(cols[4])
                            });
                        }
                    });

                    if (parsedMonthly.length > 0) {
                        setMetaTotal(parsedMeta);
                        setSaldoInicial(parsedSaldo);
                        setHouseMetas(parsedMetas);
                        setContributions(parsedMonthly);
                        persistData(parsedMonthly, parsedMeta, parsedSaldo, parsedMetas);
                        addNotification("Importación de CSV completada", "success");
                    }
                } catch (err) {
                    addNotification("Error procesando CSV", "error");
                }
            };

            return (
                <div class="flex-1 flex flex-col min-h-screen">
                    {/* ENCABEZADO PRÉMIUM */}
                    <header class="bg-slate-900 border-b border-slate-800 py-4 px-6 sticky top-0 z-40 shadow-xl">
                        <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
                            <div class="flex items-center gap-4">
                                <div class="p-3 bg-gradient-to-tr from-cyan-600 to-indigo-500 rounded-2xl shadow-lg shadow-indigo-500/20 text-white animate-fadeIn">
                                    {SVGIcons.home}
                                </div>
                                <div>
                                    <h1 class="text-xl font-extrabold tracking-tight text-white flex items-center gap-2">
                                        Nuestra Casa <span class="text-[10px] uppercase font-black tracking-widest bg-cyan-500/10 text-cyan-400 border border-cyan-500/20 px-2 py-0.5 rounded-md">Protected</span>
                                    </h1>
                                    <p class="text-xs text-slate-400">Panel financiero inteligente de Laura & Asier</p>
                                </div>
                            </div>

                            {/* ESTADOS DE SINCRONIZACIÓN Y USUARIO */}
                            <div class="flex flex-wrap items-center gap-3">
                                {firebaseStatus === 'connected' ? (
                                    <span class="flex items-center gap-1.5 bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 px-3 py-1.5 rounded-xl text-xs font-bold animate-fadeIn">
                                        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                                        Nube Activa (housecontrol-2bace)
                                    </span>
                                ) : (
                                    <span class="flex items-center gap-1.5 bg-rose-500/10 border border-rose-500/20 text-rose-400 px-3 py-1.5 rounded-xl text-xs font-bold animate-fadeIn">
                                        <span class="w-2 h-2 rounded-full bg-rose-500 animate-pulse"></span>
                                        Almacenamiento Local Seguro
                                    </span>
                                )}

                                <button onClick={logout} class="bg-slate-800 hover:bg-slate-750 border border-slate-700 text-slate-300 text-xs px-3.5 py-1.5 rounded-xl font-bold transition flex items-center gap-1">
                                    Cerrar Sesión
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* PIE DE NOTIFICACIONES */}
                    <div class="fixed bottom-6 right-6 z-50 flex flex-col gap-2 max-w-sm">
                        {notifications.map(n => (
                            <div key={n.id} class={`flex items-center gap-2.5 p-3.5 rounded-2xl shadow-2xl border text-sm font-semibold animate-fadeIn ${
                                n.type === 'success' ? 'bg-emerald-950/95 text-emerald-300 border-emerald-500/30' :
                                n.type === 'error' ? 'bg-rose-950/95 text-rose-300 border-rose-500/30' :
                                'bg-slate-900/95 text-slate-200 border-slate-700'
                            }`}>
                                <span class="text-brand-400 shrink-0">{SVGIcons.save}</span>
                                <span>{n.message}</span>
                            </div>
                        ))}
                    </div>

                    {/* PROGRESO INTEGRADO GLOBAL */}
                    <div class="bg-slate-900/50 px-6 py-3 border-b border-slate-800">
                        <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
                            <div class="w-full md:w-2/3 space-y-1">
                                <div class="flex justify-between text-xs text-slate-400 font-bold">
                                    <span>PROGRESO DE AHORRO DE LA ENTRADA (10% + Gastos e IVA)</span>
                                    <span>{processedData.porcentajeProgreso.toFixed(1)}%</span>
                                </div>
                                <div class="w-full bg-slate-850 rounded-full h-3.5 relative overflow-hidden p-0.5">
                                    <div class="bg-gradient-to-r from-cyan-500 via-indigo-500 to-purple-500 h-full rounded-full transition-all duration-1000" style={{ width: `${processedData.porcentajeProgreso}%` }}></div>
                                </div>
                            </div>
                            <div class="text-right shrink-0">
                                <div class="text-lg font-black text-white">{processedData.totalAhorrado.toLocaleString('es-ES', { minimumFractionDigits: 2 })} €</div>
                                <div class="text-[10px] text-slate-400 font-semibold uppercase">de un total necesario de {metaTotal.toLocaleString('es-ES')} €</div>
                            </div>
                        </div>
                    </div>

                    {/* NAVEGADOR DE CONTENIDO */}
                    <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
                        
                        {/* Selector de Pestañas (Lateral Izquierdo) */}
                        <div class="lg:col-span-3 flex flex-row lg:flex-col gap-1.5 overflow-x-auto pb-3 lg:pb-0 border-b lg:border-b-0 lg:border-r border-slate-800/60 lg:pr-4">
                            <button onClick={() => setCurrentTab('dashboard')} class={`flex items-center gap-3 px-4 py-3 rounded-2xl text-xs font-bold uppercase tracking-wider transition shrink-0 ${currentTab === 'dashboard' ? 'bg-cyan-500/10 border border-cyan-500/20 text-cyan-400' : 'hover:bg-slate-900 text-slate-400'}`}>
                                {SVGIcons.wallet}
                                Cuenta Conjunta Revolut
                            </button>
                            <button onClick={() => setCurrentTab('simulation')} class={`flex items-center gap-3 px-4 py-3 rounded-2xl text-xs font-bold uppercase tracking-wider transition shrink-0 ${currentTab === 'simulation' ? 'bg-cyan-500/10 border border-cyan-500/20 text-cyan-400' : 'hover:bg-slate-900 text-slate-400'}`}>
                                {SVGIcons.scale}
                                Registro de Historial
                            </button>

        // --- SUBCOMPONENTE DE GRÁFICO VECTORIAL (SVG) EXTREMADAMENTE SEGURO Y COMPATIBLE ---
        function ResponsiveSVGChart({ rows, metaTotal }) {
            if (!rows || rows.length === 0) return null;

            const width = 600;
            const height = 180;
            const padding = 30;

            const maxVal = Math.max(...rows.map(r => Math.max(r.acumulado, r.simulacionAcumulado, metaTotal))) * 1.1;
            const minVal = 0;

            const pointsReal = rows.map((r, i) => {
                const x = padding + (i / (rows.length - 1)) * (width - padding * 2);
                const y = height - padding - ((r.acumulado - minVal) / (maxVal - minVal)) * (height - padding * 2);
                return { x, y, val: r.acumulado, name: r.name };
            });

            const pointsSim = rows.map((r, i) => {
                const x = padding + (i / (rows.length - 1)) * (width - padding * 2);
                const y = height - padding - ((r.simulacionAcumulado - minVal) / (maxVal - minVal)) * (height - padding * 2);
                return { x, y, val: r.simulacionAcumulado };
            });

            const pathRealD = pointsReal.map((p, i) => `${i === 0 ? 'M' : 'L'} ${p.x} ${p.y}`).join(' ');
            const pathSimD = pointsSim.map((p, i) => `${i === 0 ? 'M' : 'L'} ${p.x} ${p.y}`).join(' ');

            const areaRealD = `${pathRealD} L ${pointsReal[pointsReal.length - 1].x} ${height - padding} L ${pointsReal[0].x} ${height - padding} Z`;

            return (
                <div class="relative w-full">
                    <svg viewBox={`0 0 ${width} ${height}`} class="w-full h-auto text-slate-700">
                        <defs>
                            <linearGradient id="realGradient" x1="0" y1="0" x2="0" y2="1">
                                <stop offset="0%" stopColor="#0ea5e9" />
                                <stop offset="100%" stopColor="transparent" />
                            </linearGradient>
                        </defs>
                        {[0, 0.25, 0.5, 0.75, 1].map((ratio, idx) => {
                            const y = padding + ratio * (height - padding * 2);
                            const valLabel = Math.round(maxVal - ratio * (maxVal - minVal));
                            return (
                                <g key={idx}>
                                    <line x1={padding} y1={y} x2={width - padding} y2={y} stroke="rgba(51, 65, 85, 0.15)" strokeWidth="1" />
                                    <text x={padding - 5} y={y + 3} fill="#475569" fontSize="8" fontWeight="bold" textAnchor="end">
                                        {valLabel.toLocaleString('es-ES')}
                                    </text>
                                </g>
                            );
                        })}

                        <path d={areaRealD} fill="url(#realGradient)" opacity="0.12" />
                        <path d={pathSimD} fill="none" stroke="#6366f1" strokeWidth="2" strokeDasharray="3,3" />
                        <path d={pathRealD} fill="none" stroke="#0ea5e9" strokeWidth="3" strokeLinecap="round" />

                        {pointsReal.map((p, i) => (
                            <g key={i} class="group cursor-pointer">
                                <circle cx={p.x} cy={p.y} r="3.5" fill="#0ea5e9" stroke="#0f172a" strokeWidth="1.5" />
                                <circle cx={p.x} cy={p.y} r="8" fill="transparent" />
                                <title>{`${p.name}: ${Math.round(p.val).toLocaleString('es-ES')} €`}</title>
                            </g>
                        ))}

                        {pointsReal.filter((_, idx) => idx % 2 === 0).map((p, idx) => (
                            <text key={idx} x={p.x} y={height - 8} fill="#64748b" fontSize="8" fontWeight="bold" textAnchor="middle">
                                {p.name.split(' ')[0]}
                            </text>
                        ))}
                    </svg>
                </div>
            );
        }

        // --- COMPONENTE INTERACTIVO DE LÍNEA TEMPORAL DE LA CASA CON EL "MONIGOTE" EN EL DÍA EXACTO ---
        function InteractiveInteractiveTimeline({ contributions, processedData, targetSaving, metaTotal, houseMetas, saldoInicial }) {
            const totalMuebles = processedData.totalMueblesPresupuesto - processedData.totalMueblesGastado;

            // Motor de Proyección de Hitos Dinámico
            const lastMonthIndex = contributions.length;
            const lastMonthAccumulated = processedData.totalAhorrado;

            const calculateMonthProjection = (targetAmount) => {
                if (targetAmount <= lastMonthAccumulated) {
                    let sum = saldoInicial;
                    for (let i = 0; i < contributions.length; i++) {
                        sum += Number(contributions[i].laura) + Number(contributions[i].asier);
                        if (sum >= targetAmount) {
                            return i + 1; // Month index (1-based)
                        }
                    }
                    return 1;
                } else {
                    const remaining = targetAmount - lastMonthAccumulated;
                    const additional = Math.ceil(remaining / targetSaving);
                    return lastMonthIndex + additional;
                }
            };

            // Hito 1: Entrada (34.870 €)
            const indexEntrada = calculateMonthProjection(34870);
            // Hito 2: IVA & Gastos (62.766 € acumulado)
            const indexIVA = calculateMonthProjection(34870 + 27896);
            // Hito 3: Personalización (66.629,20 € acumulado)
            const indexPersonalizacion = calculateMonthProjection(metaTotal);
            // Hito 4: Muebles Completos
            const indexMuebles = calculateMonthProjection(metaTotal + totalMuebles);

            // Conversor de número de mes (1 = Marzo 2026) a etiqueta legible de mes y año
            const getMonthLabel = (idx) => {
                const date = new Date(2026, 2, 1); // Marzo 1, 2026
                date.setMonth(date.getMonth() + (idx - 1));
                return date.toLocaleDateString('es-ES', { month: 'short', year: '2-digit' }).toUpperCase();
            };

            const getMonthFullLabel = (idx) => {
                const date = new Date(2026, 2, 1);
                date.setMonth(date.getMonth() + (idx - 1));
                return date.toLocaleDateString('es-ES', { month: 'long', year: 'numeric' });
            };

            // Eje de la línea temporal: Marzo 2026 (Mes 1) a Septiembre 2028 (Mes 31) -> 31 meses
            const mapIndexToPercentage = (idx) => {
                return Math.max(0, Math.min(100, ((idx - 1) / 30) * 100));
            };

            // Posición de hoy (12 de junio de 2026)
            // Marzo 2026 a Septiembre 2028 es 944 días. Hoy es el día 104.
            const todayPercentage = 11.0; 

            // Hitos con sus porcentajes y metadatos
            const timelineMilestones = [
                {
                    id: 'entrada',
                    label: '10% Segunda Entrada',
                    amount: '34.870 €',
                    index: indexEntrada,
                    color: 'text-cyan-400',
                    bgColor: 'bg-cyan-500',
                    borderColor: 'border-cyan-500',
                    isPast: indexEntrada <= 4, // Ya pasó de junio de 2026
                    deadlineOk: indexEntrada <= 31
                },
                {
                    id: 'iva',
                    label: 'IVA & Gastos de Escritura',
                    amount: '27.896 €',
                    index: indexIVA,
                    color: 'text-purple-400',
                    bgColor: 'bg-purple-500',
                    borderColor: 'border-purple-500',
                    isPast: indexIVA <= 4,
                    deadlineOk: indexIVA <= 31
                },
                {
                    id: 'pers',
                    label: 'Personalización',
                    amount: '3.863 €',
                    index: indexPersonalizacion,
                    color: 'text-brand-400',
                    bgColor: 'bg-brand-500',
                    borderColor: 'border-brand-500',
                    isPast: indexPersonalizacion <= 4,
                    deadlineOk: indexPersonalizacion <= 31
                },
                {
                    id: 'muebles',
                    label: 'muebles completos',
                    amount: `${totalMuebles.toLocaleString('es-ES')} €`,
                    index: indexMuebles,
                    color: 'text-pink-400',
                    bgColor: 'bg-pink-500',
                    borderColor: 'border-pink-500',
                    isPast: indexMuebles <= 4,
                    deadlineOk: indexMuebles <= 31
                }
            ];

            return (
                <div class="space-y-8 py-6 px-4">
                    {/* El carril de la línea temporal */}
                    <div class="relative w-full h-12 flex items-center">
                        {/* Línea base de carril */}
                        <div class="absolute w-full h-1.5 bg-slate-800 rounded-full"></div>
                        
                        {/* Progreso completado de tiempo hasta HOY */}
                        <div class="absolute h-1.5 bg-gradient-to-r from-cyan-600 to-indigo-500 rounded-full" style={{ width: `${todayPercentage}%` }}></div>

                        {/* PIN DE HOY: El Monigote Constructor 👷‍♂️ */}
                        <div class="absolute -translate-x-1/2 -top-1 z-30 flex flex-col items-center" style={{ left: `${todayPercentage}%` }}>
                            {/* Globo interactivo */}
                            <div class="bg-indigo-600 text-white font-extrabold text-[9px] px-2 py-0.5 rounded-md mb-1 shadow-lg shadow-indigo-500/20 whitespace-nowrap animate-bounce uppercase">
                                ¡Estáis aquí!
                            </div>
                            {/* Monigote SVG */}
                            <div class="relative">
                                <span class="absolute -inset-1 rounded-full bg-cyan-500/30 glowing-ring"></span>
                                <svg class="w-6 h-6 text-yellow-400 drop-shadow" viewBox="0 0 24 24" fill="currentColor">
                                    {/* Dibujo de monigote con casco de seguridad */}
                                    <circle cx="12" cy="8" r="4" fill="#fbbf24" />
                                    <path d="M12 2a4 4 0 0 1 4 4h-8a4 4 0 0 1 4-4z" fill="#f59e0b" /> {/* Casco */}
                                    <path d="M12 14c-4.418 0-8 2.239-8 5v3h16v-3c0-2.761-3.582-5-8-5z" fill="#38bdf8" /> {/* Cuerpo azul */}
                                </svg>
                            </div>
                        </div>

                        {/* Hitos a lo largo del carril */}
                        {timelineMilestones.map((milestone) => {
                            const pct = mapIndexToPercentage(milestone.index);
                            const onTime = milestone.deadlineOk;
                            return (
                                <div key={milestone.id} class="absolute -translate-x-1/2 flex flex-col items-center z-10" style={{ left: `${pct}%` }}>
                                    {/* Marcador del punto */}
                                    <div class={`w-4 h-4 rounded-full border-2 bg-slate-950 flex items-center justify-center transition-all ${
                                        milestone.isPast ? 'border-emerald-500 bg-emerald-500/10' :
                                        onTime ? 'border-cyan-500 bg-cyan-500/10' : 'border-rose-500 bg-rose-500/10'
                                    }`}>
                                        <span class={`w-1.5 h-1.5 rounded-full ${milestone.isPast ? 'bg-emerald-400' : onTime ? 'bg-cyan-400' : 'bg-rose-500 animate-ping'}`}></span>
                                    </div>
                                    {/* Etiqueta del mes debajo del carril */}
                                    <span class="text-[9px] font-black text-slate-400 mt-2 bg-slate-900 px-1 py-0.5 rounded border border-slate-800">
                                        {getMonthLabel(milestone.index)}
                                    </span>
                                </div>
                            );
                        })}

                        {/* Hito Final Límite: Septiembre de 2028 */}
                        <div class="absolute right-0 -translate-x-1/2 flex flex-col items-center z-20">
                            <div class="w-5 h-5 rounded-lg bg-indigo-600 flex items-center justify-center text-white border border-indigo-500 shadow-md">
                                🗝️
                            </div>
                            <span class="text-[9px] font-black text-indigo-400 mt-2 bg-indigo-950/60 px-1 py-0.5 rounded border border-indigo-800/40">
                                SEP 28
                            </span>
                        </div>
                    </div>

                    {/* Explicación y desglose de los hitos proyectados en formato de tarjetas */}
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-8 pt-4">
                        {timelineMilestones.map((m) => {
                            const onTime = m.deadlineOk;
                            const isFinished = m.isPast;
                            return (
                                <div key={m.id} class={`p-4 rounded-2xl border transition ${
                                    isFinished ? 'bg-emerald-950/10 border-emerald-500/20' :
                                    onTime ? 'bg-slate-900/60 border-slate-800/80' : 'bg-rose-950/10 border-rose-500/20'
                                }`}>
                                    <div class="flex items-start justify-between">
                                        <div class="space-y-1">
                                            <h4 class="text-xs font-black text-white uppercase tracking-wider">{m.label}</h4>
                                            <p class="text-[10px] text-slate-400">Objetivo acumulado necesario: <strong class="text-white">{m.amount}</strong></p>
                                        </div>
                                        <span class={`text-[9px] font-bold px-2 py-0.5 rounded-full ${
                                            isFinished ? 'bg-emerald-500/10 text-emerald-400' :
                                            onTime ? 'bg-cyan-500/10 text-cyan-400' : 'bg-rose-500/10 text-rose-400'
                                        }`}>
                                            {isFinished ? '¡YA ALCANZADO!' : onTime ? 'A tiempo' : 'En riesgo (tarde)'}
                                        </span>
                                    </div>
                                    
                                    <div class="mt-4 flex items-center justify-between text-xs">
                                        <span class="text-slate-400">Fecha proyectada:</span>
                                        <strong class="text-white font-extrabold">{getMonthFullLabel(m.index)}</strong>
                                    </div>
                                    
                                    <div class="mt-2 text-[10px] text-slate-500 leading-relaxed">
                                        {isFinished ? (
                                            `Ya acumulasteis la cantidad correspondiente de este hito con las aportaciones registradas.`
                                        ) : onTime ? (
                                            `Llegaréis con holgura de ${31 - m.index} meses antes del límite de firma establecido para el Q3 de 2028.`
                                        ) : (
                                            `Al ritmo de ahorro fijado (€${targetSaving}/mes), este hito se retrasará hasta después del límite. Se recomienda aumentar el ahorro.`
                                        )}
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        }

        // Renderizado inicial
        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>
</html>

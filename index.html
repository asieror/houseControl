<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-900 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vivienda Segura - Dashboard Lutxana 2028</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        slate: {
                            950: '#0f172a',
                        }
                    }
                }
            }
        }
    </script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.24.0/babel.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore-compat.js"></script>
</head>
<body class="h-full font-sans antialiased bg-slate-950 text-slate-100">

    <div id="root" class="h-full"></div>

    <script type="text/babel">
        /* @jsx React.createElement */
        /* @jsxFrag React.Fragment */

        // --- CONFIGURACIÓN DE FIREBASE ---
        const firebaseConfig = {
            apiKey: "TU_API_KEY",
            authDomain: "TU_AUTH_DOMAIN",
            projectId: "TU_PROJECT_ID",
            storageBucket: "TU_STORAGE_BUCKET",
            messagingSenderId: "TU_MESSAGING_SENDER_ID",
            appId: "TU_APP_ID"
        };

        // Inicializar Firebase de forma segura
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        const auth = firebase.auth();
        const db = firebase.firestore();
        const googleProvider = new firebase.auth.GoogleAuthProvider();

        const ALLOWED_EMAILS = [
            "laura@gmail.com", 
            "asier@gmail.com"
        ];

        // --- ICONOS SVG COMPONENTES ---
        const Icons = {
            Lock: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 15v2m0 0v2m0-2h2m-2 0H10m3.5-3.5a3.5 3.5 0 11-7 0 3.5 3.5 0 017 0zM17.4 10.5a6.5 6.5 0 00-12.8 0H17.4z"/></svg>,
            Home: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>,
            TrendingUp: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/></svg>,
            Scale: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>,
            Calendar: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>,
            Calculator: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 11h.01M12 7h.01M15 11h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>,
            Trash: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>,
            Edit: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
        };

        function App() {
            // Estados de Autenticación
            const [user, setUser] = React.useState(null);
            const [pin, setPin] = React.useState("");
            const [pinAuthenticated, setPinAuthenticated] = React.useState(false);
            const [authError, setAuthError] = React.useState("");

            // Estados de la Aplicación
            const [revolutBase, setRevolutBase] = React.useState(25000);
            const [tin, setTin] = React.useState(3.5); 
            const [daysElapsed, setDaysElapsed] = React.useState(30); 

            // Estados de Equidad y Reembolsos
            const initialLaura = 33000;
            const initialAsier = 10000;
            const [refunds, setRefunds] = React.useState([]);
            const [newRefund, setNewRefund] = React.useState({ amount: "", description: "" });

            // Estados del Historial Mensual (CRUD)
            const [months, setMonths] = React.useState([]);
            const [newMonth, setNewMonth] = React.useState({ id: "", lauraCount: 0, asierCount: 0, simulatedPlan: 1500 });
            const [editingMonth, setEditingMonth] = React.useState(null);
            const [editForm, setEditForm] = React.useState({ lauraCount: 0, asierCount: 0, simulatedPlan: 1500 });

            // Estados de Simulación Hipoteca y Muebles
            const [mortgage, setMortgage] = React.useState({ capital: 150000, interest: 3.0, years: 30 });
            const [furniture, setFurniture] = React.useState([]);
            const [newFurniture, setNewFurniture] = React.useState({ item: "", cost: "" });

            // --- MANEJO DE AUTENTICACIÓN ---
            const handlePinSubmit = (e) => {
                e.preventDefault();
                if (pin === "1234") {
                    setPinAuthenticated(true);
                    setAuthError("");
                } else {
                    setAuthError("PIN Local incorrecto.");
                }
            };

            const handleGoogleLogin = () => {
                auth.signInWithPopup(googleProvider)
                    .then((result) => {
                        const email = result.user.email;
                        if (ALLOWED_EMAILS.includes(email)) {
                            setUser(result.user);
                            setAuthError("");
                            loadDataFromFirestore();
                        } else {
                            auth.signOut();
                            setAuthError("Acceso denegado: Email no autorizado.");
                        }
                    })
                    .catch((error) => {
                        setAuthError("Error en Google Auth: " + error.message);
                    });
            };

            const handleLogout = () => {
                auth.signOut().then(() => {
                    setUser(null);
                    setPinAuthenticated(false);
                    setPin("");
                });
            };

            // --- PERSISTENCIA FIRESTORE ---
            const loadDataFromFirestore = () => {
                db.collection("vivienda_segura").doc("dashboard").get()
                    .then((doc) => {
                        if (doc.exists) {
                            const data = doc.data();
                            if (data.revolutBase !== undefined) setRevolutBase(data.revolutBase);
                            if (data.tin !== undefined) setTin(data.tin);
                            if (data.daysElapsed !== undefined) setDaysElapsed(data.daysElapsed);
                            if (data.refunds !== undefined) setRefunds(data.refunds);
                            if (data.months !== undefined) setMonths(data.months);
                            if (data.mortgage !== undefined) setMortgage(data.mortgage);
                            if (data.furniture !== undefined) setFurniture(data.furniture);
                        } else {
                            syncToFirestore({
                                revolutBase: 25000, tin: 3.5, daysElapsed: 30,
                                refunds: [], months: [], mortgage: { capital: 150000, interest: 3.0, years: 30 },
                                furniture: []
                            });
                        }
                    })
                    .catch((err) => console.error("Error cargando de Firestore: ", err));
            };

            const syncToFirestore = (updatedFields) => {
                db.collection("vivienda_segura").doc("dashboard").set(updatedFields, { merge: true })
                    .then(() => console.log("Sincronizado con éxito"))
                    .catch((err) => console.error("Error sincronizando: ", err));
            };

            React.useEffect(() => {
                if (user) {
                    const timer = setTimeout(() => {
                        syncToFirestore({ revolutBase, tin, daysElapsed, refunds, months, mortgage, furniture });
                    }, 800);
                    return () => clearTimeout(timer);
                }
            }, [revolutBase, tin, daysElapsed, refunds, months, mortgage, furniture, user]);

            // --- LÓGICA DE NEGOCIO ---
            const totalInteresesBrutos = revolutBase * Math.pow(1 + (tin / 100) / 365, daysElapsed) - revolutBase;
            const irpfRetencion = totalInteresesBrutos * 0.19;
            const revolutNeto = revolutBase + (totalInteresesBrutos - irpfRetencion);

            const totalRefunds = refunds.reduce((acc, curr) => acc + parseFloat(curr.amount || 0), 0);
            const deudaInicialAsier = (initialLaura - initialAsier) / 2;
            const deudaActualAsier = deudaInicialAsier - totalRefunds;

            // Handlers CRUD Mensual
            const handleAddMonth = (e) => {
                e.preventDefault();
                if (!newMonth.id) return;
                const updatedMonths = [...months, { ...newMonth, lauraCount: parseFloat(newMonth.lauraCount || 0), asierCount: parseFloat(newMonth.asierCount || 0), simulatedPlan: parseFloat(newMonth.simulatedPlan || 0) }];
                setMonths(updatedMonths);
                setNewMonth({ id: "", lauraCount: 0, asierCount: 0, simulatedPlan: 1500 });
            };

            const startEditMonth = (m) => {
                setEditingMonth(m.id);
                setEditForm({ lauraCount: m.lauraCount, asierCount: m.asierCount, simulatedPlan: m.simulatedPlan });
            };

            const handleSaveEdit = (id) => {
                const updatedMonths = months.map(m => m.id === id ? { ...m, lauraCount: parseFloat(editForm.lauraCount || 0), asierCount: parseFloat(editForm.asierCount || 0), simulatedPlan: parseFloat(editForm.simulatedPlan || 0) } : m);
                setMonths(updatedMonths);
                setEditingMonth(null);
            };

            const handleDeleteMonth = (id) => {
                setMonths(months.filter(m => m.id !== id));
            };

            // Handlers Reembolsos Equidad
            const handleAddRefund = (e) => {
                e.preventDefault();
                if (!newRefund.amount) return;
                const updatedRefunds = [...refunds, { id: Date.now(), amount: parseFloat(newRefund.amount), description: newRefund.description, date: new Date().toLocaleDateString() }];
                setRefunds(updatedRefunds);
                setNewRefund({ amount: "", description: "" });
            };

            const handleDeleteRefund = (id) => {
                setRefunds(refunds.filter(r => r.id !== id));
            };

            // Simulador Francés Hipoteca
            const r_rate = (mortgage.interest / 100) / 12;
            const n_months = mortgage.years * 12;
            const cuotaMensualHipoteca = r_rate === 0 ? (mortgage.capital / n_months) : (mortgage.capital * r_rate * Math.pow(1 + r_rate, n_months)) / (Math.pow(1 + r_rate, n_months) - 1);

            // Gestión Mobiliario
            const handleAddFurniture = (e) => {
                e.preventDefault();
                if (!newFurniture.item || !newFurniture.cost) return;
                const updated = [...furniture, { id: Date.now(), item: newFurniture.item, cost: parseFloat(newFurniture.cost) }];
                setFurniture(updated);
                setNewFurniture({ item: "", cost: "" });
            };

            const handleDeleteFurniture = (id) => {
                setFurniture(furniture.filter(f => f.id !== id));
            };
            const totalFurnitureCost = furniture.reduce((acc, curr) => acc + curr.cost, 0);

            // --- VISTAS DE RENDERIZADO ---
            if (!user || !pinAuthenticated) {
                return (
                    <div className="flex flex-col items-center justify-center min-h-screen px-4 bg-slate-950">
                        <div className="w-full max-w-md p-8 rounded-2xl bg-slate-900 border border-slate-800 shadow-2xl">
                            <div className="flex flex-col items-center mb-8">
                                <div className="p-3 bg-emerald-500/10 text-emerald-400 rounded-xl mb-3">
                                    <Icons.Home />
                                </div>
                                <h1 className="text-2xl font-bold tracking-tight text-white">Vivienda Segura</h1>
                                <p className="text-xs text-slate-400 mt-1">Dashboard de Ahorro - Lutxana 2028</p>
                            </div>

                            {authError && (
                                <div className="p-3 mb-4 text-xs font-medium text-red-400 bg-red-500/10 border border-red-500/20 rounded-lg">
                                    {authError}
                                </div>
                            )}

                            {!pinAuthenticated ? (
                                <form onSubmit={handlePinSubmit} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Paso 1: PIN de Acceso Común</label>
                                        <input 
                                            type="password" 
                                            placeholder="Introduce el PIN" 
                                            value={pin}
                                            onChange={(e) => setPin(e.target.value)}
                                            className="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl text-center text-xl font-mono tracking-widest text-white focus:outline-none focus:border-emerald-500"
                                        />
                                    </div>
                                    <button type="submit" className="w-full py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold rounded-xl tracking-wide shadow-lg transition-all">
                                        Validar PIN
                                    </button>
                                </form>
                            ) : (
                                <div className="space-y-4">
                                    <label className="block text-xs font-semibold uppercase tracking-wider text-slate-400 text-center mb-1">Paso 2: Autenticación Identificada</label>
                                    <button 
                                        onClick={handleGoogleLogin}
                                        className="w-full flex items-center justify-center gap-3 py-3 bg-white hover:bg-slate-100 text-slate-900 font-semibold rounded-xl shadow-md transition-all"
                                    >
                                        <svg className="w-5 h-5" viewBox="0 0 24 24">
                                            <path fill="#EA4335" d="M12.24 10.285V13.4h6.887c-.275 1.565-1.88 4.604-6.887 4.604-4.33 0-7.866-3.577-7.866-8s3.536-8 7.866-8c2.46 0 4.105 1.025 5.047 1.926l2.427-2.334C17.955 2.192 15.34 1 12.24 1 6.033 1 12.24 1 6.033 1 12.24s5.033 11.24 11.24 11.24c6.478 0 10.793-4.537 10.793-10.997 0-.746-.08-1.32-.176-1.883H12.24z"/>
                                        </svg>
                                        Acceder con Google Auth
                                    </button>
                                </div>
                            )}
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen flex flex-col bg-slate-950 text-slate-100">
                    <header className="border-b border-slate-800 bg-slate-900/50 backdrop-blur sticky top-0 z-50 px-6 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
                        <div className="flex items-center gap-3">
                            <span className="p-2 bg-emerald-500/10 text-emerald-400 rounded-lg"><Icons.Home /></span>
                            <div>
                                <h1 className="text-xl font-bold tracking-tight">Vivienda Segura 🏠</h1>
                                <p className="text-xs text-slate-400">Ahorro Común · Piso en Lutxana 2028</p>
                            </div>
                        </div>
                        <div className="flex items-center gap-4">
                            <div className="text-right hidden sm:block">
                                <p className="text-xs text-slate-400">Usuario Conectado</p>
                                <p className="text-sm font-semibold text-emerald-400">{user.email}</p>
                            </div>
                            <button onClick={handleLogout} className="px-4 py-2 border border-slate-800 hover:bg-slate-800 text-xs font-semibold rounded-lg text-slate-300 transition-colors">
                                Cerrar Sesión
                            </button>
                        </div>
                    </header>

                    <main className="flex-1 p-6 space-y-6 max-w-7xl mx-auto w-full">
                        {/* REVOLUT CARD */}
                        <section className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                            <div className="lg:col-span-1 bg-slate-900 border border-slate-800 rounded-2xl p-6 flex flex-col justify-between">
                                <div>
                                    <div className="flex justify-between items-center mb-4">
                                        <span className="text-xs font-bold uppercase tracking-wider text-slate-400">Fondo Común Revolut</span>
                                        <span className="p-1.5 bg-sky-500/10 text-sky-400 rounded-lg"><Icons.TrendingUp /></span>
                                    </div>
                                    <p className="text-xs text-slate-400">Saldo Neto Estimado (IRPF 19%)</p>
                                    <h2 className="text-4xl font-extrabold text-white tracking-tight mt-1">
                                        {revolutNeto.toLocaleString('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}€
                                    </h2>
                                </div>
                                <div className="mt-6 pt-4 border-t border-slate-800 grid grid-cols-2 gap-2 text-xs">
                                    <div>
                                        <span className="text-slate-400">Neto Generado:</span>
                                        <p className="font-semibold text-emerald-400">+{ (totalInteresesBrutos - irpfRetencion).toFixed(2) }€</p>
                                    </div>
                                    <div>
                                        <span className="text-slate-400">Retención (19%):</span>
                                        <p className="font-semibold text-rose-400">-{ irpfRetencion.toFixed(2) }€</p>
                                    </div>
                                </div>
                            </div>

                            <div className="lg:col-span-2 bg-slate-900 border border-slate-800 rounded-2xl p-6">
                                <h3 className="text-sm font-bold uppercase tracking-wider text-slate-400 mb-4">Parámetros Cuenta de Ahorro</h3>
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                    <div>
                                        <label className="block text-xs font-medium text-slate-400 mb-1">Capital Inicial (€)</label>
                                        <input type="number" value={revolutBase} onChange={(e) => setRevolutBase(parseFloat(e.target.value) || 0)} className="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-lg text-white focus:outline-none" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-medium text-slate-400 mb-1">TIN Nominal Anual (%)</label>
                                        <input type="number" step="0.01" value={tin} onChange={(e) => setTin(parseFloat(e.target.value) || 0)} className="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-lg text-white focus:outline-none" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-medium text-slate-400 mb-1">Días Acumulados</label>
                                        <input type="number" value={daysElapsed} onChange={(e) => setDaysElapsed(parseInt(e.target.value) || 0)} className="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-lg text-white focus:outline-none" />
                                    </div>
                                </div>
                            </div>
                        </section>

                        {/* EQUIDAD */}
                        <section className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                            <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 flex flex-col justify-between">
                                <div>
                                    <div className="flex justify-between items-center mb-4">
                                        <span className="text-xs font-bold uppercase tracking-wider text-slate-400">Balance de Equidad (50/50)</span>
                                        <span className="p-1.5 bg-amber-500/10 text-amber-400 rounded-lg"><Icons.Scale /></span>
                                    </div>
                                    <div className="grid grid-cols-2 gap-2 mt-1 mb-4 text-xs">
                                        <div className="bg-slate-950 p-2 rounded-lg border border-slate-800"><span className="text-slate-400">Laura:</span> <p className="font-bold text-white">33.000€</p></div>
                                        <div className="bg-slate-950 p-2 rounded-lg border border-slate-800"><span className="text-slate-400">Asier:</span> <p className="font-bold text-white">10.000€</p></div>
                                    </div>
                                    <p className="text-xs text-slate-400">Deuda Restante de Asier</p>
                                    <h2 className={`text-3xl font-extrabold tracking-tight mt-1 ${deudaActualAsier > 0 ? 'text-amber-400' : 'text-emerald-400'}`}>
                                        {deudaActualAsier > 0 ? `${deudaActualAsier.toLocaleString('es-ES')}€` : '¡Saldado al 50%!'}
                                    </h2>
                                </div>
                            </div>

                            <div className="lg:col-span-2 bg-slate-900 border border-slate-800 rounded-2xl p-6">
                                <h3 className="text-sm font-bold uppercase tracking-wider text-slate-400 mb-4">Reembolsos a Laura</h3>
                                <form onSubmit={handleAddRefund} className="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-4">
                                    <input type="number" placeholder="Cantidad (€)" value={newRefund.amount} onChange={(e) => setNewRefund({...newRefund, amount: e.target.value})} className="px-3 py-2 bg-slate-950 border border-slate-800 rounded-lg text-white text-sm focus:outline-none" />
                                    <input type="text" placeholder="Concepto" value={newRefund.description} onChange={(e) => setNewRefund({...newRefund, description: e.target.value})} className="px-3 py-2 bg-slate-950 border border-slate-800 rounded-lg text-white text-sm focus:outline-none" />
                                    <button type="submit" className="bg-amber-600 hover:bg-amber-500 text-white font-semibold text-sm rounded-lg py-2 transition-colors">Registrar Pago</button>
                                </form>
                                <div className="max-h-32 overflow-y-auto space-y-1.5">
                                    {refunds.map(r => (
                                        <div key={r.id} className="flex justify-between items-center text-xs bg-slate-950 p-2 rounded-lg border border-slate-800">
                                            <span><strong className="text-white">{r.amount}€</strong> - {r.description || 'Devolución'}</span>
                                            <button onClick={() => handleDeleteRefund(r.id)} className="text-rose-400 hover:text-rose-300"><Icons.Trash /></button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </section>

                        {/* HISTORIAL MENSUAL (CRUD) */}
                        <section className="bg-slate-900 border border-slate-800 rounded-2xl p-6">
                            <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-4">
                                <div className="flex items-center gap-2">
                                    <span className="p-1.5 bg-emerald-500/10 text-emerald-400 rounded-lg"><Icons.Calendar /></span>
                                    <h3 className="text-sm font-bold uppercase tracking-wider text-slate-300">Historial Mensual</h3>
                                </div>
                                <form onSubmit={handleAddMonth} className="flex flex-wrap gap-2 bg-slate-950 p-2 rounded-xl border border-slate-800">
                                    <input type="text" placeholder="Mes" value={newMonth.id} onChange={(e) => setNewMonth({...newMonth, id: e.target.value})} className="px-2 py-1 bg-slate-900 border border-slate-800 rounded text-xs text-white focus:outline-none w-20" />
                                    <input type="number" placeholder="Laura €" value={newMonth.lauraCount || ""} onChange={(e) => setNewMonth({...newMonth, lauraCount: e.target.value})} className="px-2 py-1 bg-slate-900 border border-slate-800 rounded text-xs text-white focus:outline-none w-16" />
                                    <input type="number" placeholder="Asier €" value={newMonth.asierCount || ""} onChange={(e) => setNewMonth({...newMonth, asierCount: e.target.value})} className="px-2 py-1 bg-slate-900 border border-slate-800 rounded text-xs text-white focus:outline-none w-16" />
                                    <input type="number" placeholder="Plan €" value={newMonth.simulatedPlan || ""} onChange={(e) => setNewMonth({...newMonth, simulatedPlan: e.target.value})} className="px-2 py-1 bg-slate-900 border border-slate-800 rounded text-xs text-white focus:outline-none w-16" />
                                    <button type="submit" className="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold text-xs px-2.5 py-1 rounded">Añadir</button>
                                </form>
                            </div>

                            <div className="overflow-x-auto">
                                <table className="w-full text-left text-xs">
                                    <thead>
                                        <tr className="border-b border-slate-800 text-slate-400 bg-slate-950/50">
                                            <th className="p-2.5">Mes</th>
                                            <th className="p-2.5">Laura</th>
                                            <th className="p-2.5">Asier</th>
                                            <th className="p-2.5">Total Real</th>
                                            <th className="p-2.5">Objetivo</th>
                                            <th className="p-2.5">Desviación</th>
                                            <th className="p-2.5 text-right">Acciones</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-800/40">
                                        {months.map(m => {
                                            const totalReal = m.lauraCount + m.asierCount;
                                            const dev = totalReal - m.simulatedPlan;
                                            return (
                                                <tr key={m.id} className="hover:bg-slate-800/20">
                                                    <td className="p-2.5 font-semibold text-white">{m.id}</td>
                                                    <td className="p-2.5">
                                                        {editingMonth === m.id ? (
                                                            <input type="number" className="p-1 bg-slate-950 border border-slate-700 rounded text-white w-16" value={editForm.lauraCount} onChange={(e) => setEditForm({...editForm, lauraCount: e.target.value})} />
                                                        ) : `${m.lauraCount}€`}
                                                    </td>
                                                    <td className="p-2.5">
                                                        {editingMonth === m.id ? (
                                                            <input type="number" className="p-1 bg-slate-950 border border-slate-700 rounded text-white w-16" value={editForm.asierCount} onChange={(e) => setEditForm({...editForm, asierCount: e.target.value})} />
                                                        ) : `${m.asierCount}€`}
                                                    </td>
                                                    <td className="p-2.5 text-slate-300">{totalReal}€</td>
                                                    <td className="p-2.5">
                                                        {editingMonth === m.id ? (
                                                            <input type="number" className="p-1 bg-slate-950 border border-slate-700 rounded text-white w-16" value={editForm.simulatedPlan} onChange={(e) => setEditForm({...editForm, simulatedPlan: e.target.value})} />
                                                        ) : `${m.simulatedPlan}€`}
                                                    </td>
                                                    <td className={`p-2.5 font-bold ${dev >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>
                                                        {dev >= 0 ? `+${dev}` : dev}€
                                                    </td>
                                                    <td className="p-2.5 text-right">
                                                        {editingMonth === m.id ? (
                                                            <div className="flex justify-end gap-1">
                                                                <button onClick={() => handleSaveEdit(m.id)} className="bg-emerald-500/20 text-emerald-400 px-1.5 py-0.5 rounded text-[10px]">OK</button>
                                                                <button onClick={() => setEditingMonth(null)} className="bg-slate-700 text-slate-300 px-1.5 py-0.5 rounded text-[10px]">X</button>
                                                            </div>
                                                        ) : (
                                                            <div className="flex justify-end gap-2 text-slate-400">
                                                                <button onClick={() => startEditMonth(m)} className="hover:text-emerald-400"><Icons.Edit /></button>
                                                                <button onClick={() => handleDeleteMonth(m.id)} className="hover:text-rose-400"><Icons.Trash /></button>
                                                            </div>
                                                        )}
                                                    </td>
                                                </tr>
                                            );
                                        })}
                                    </tbody>
                                </table>
                            </div>
                        </section>

                        {/* HIPOTECA Y MUEBLES */}
                        <section className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                            <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6">
                                <div className="flex items-center gap-2 mb-3">
                                    <span className="p-1.5 bg-indigo-500/10 text-indigo-400 rounded-lg"><Icons.Calculator /></span>
                                    <h3 className="text-sm font-bold uppercase tracking-wider text-slate-400">Simulador Sistema Francés</h3>
                                </div>
                                <div className="grid grid-cols-3 gap-2 mb-3">
                                    <input type="number" value={mortgage.capital} onChange={(e) => setMortgage({...mortgage, capital: parseFloat(e.target.value) || 0})} className="text-xs p-2 bg-slate-950 border border-slate-800 rounded-lg text-white" />
                                    <input type="number" step="0.1" value={mortgage.interest} onChange={(e) => setMortgage({...mortgage, interest: parseFloat(e.target.value) || 0})} className="text-xs p-2 bg-slate-950 border border-slate-800 rounded-lg text-white" />
                                    <input type="number" value={mortgage.years} onChange={(e) => setMortgage({...mortgage, years: parseInt(e.target.value) || 0})} className="text-xs p-2 bg-slate-950 border border-slate-800 rounded-lg text-white" />
                                </div>
                                <div className="bg-slate-950 p-3 rounded-xl border border-slate-800 text-center">
                                    <span className="text-[11px] text-slate-400">Cuota Mensual Estimada</span>
                                    <p className="text-2xl font-extrabold text-indigo-400">{cuotaMensualHipoteca.toLocaleString('es-ES', { maximumFractionDigits: 2 })}€/mes</p>
                                </div>
                            </div>

                            <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6">
                                <div className="flex justify-between items-center mb-3">
                                    <h3 className="text-sm font-bold uppercase tracking-wider text-slate-400">Presupuesto Mobiliario</h3>
                                    <span className="text-xs font-bold text-white bg-slate-950 px-2 py-0.5 rounded border border-slate-800">Total: {totalFurnitureCost}€</span>
                                </div>
                                <form onSubmit={handleAddFurniture} className="grid grid-cols-3 gap-2 mb-3">
                                    <input type="text" placeholder="Mueble" value={newFurniture.item} onChange={(e) => setNewFurniture({...newFurniture, item: e.target.value})} className="p-1.5 bg-slate-950 border border-slate-800 rounded-lg text-xs text-white" />
                                    <input type="number" placeholder="Coste" value={newFurniture.cost} onChange={(e) => setNewFurniture({...newFurniture, cost: e.target.value})} className="p-1.5 bg-slate-950 border border-slate-800 rounded-lg text-xs text-white" />
                                    <button type="submit" className="bg-indigo-600 text-white font-semibold text-xs rounded-lg py-1">Añadir</button>
                                </form>
                                <div className="max-h-24 overflow-y-auto space-y-1">
                                    {furniture.map(f => (
                                        <div key={f.id} className="flex justify-between items-center text-[11px] bg-slate-950 p-1.5 rounded border border-slate-800">
                                            <span className="text-slate-300">{f.item}</span>
                                            <div className="flex items-center gap-2">
                                                <span className="font-bold text-white">{f.cost}€</span>
                                                <button onClick={() => handleDeleteFurniture(f.id)} className="text-rose-400"><Icons.Trash /></button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </section>
                    </main>
                </div>
            );
        }

        // Renderizado clásico directo
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(React.createElement(App));
    </script>
</body>
</html>

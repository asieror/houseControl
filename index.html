        const parseMonthName = (name) => {
            let selectedMonth = "Enero";
            let selectedYear = "2026";
            if (name) {
                const foundMonth = monthsList.find(m => name.toLowerCase().includes(m.toLowerCase()));
                if (foundMonth) {
                    selectedMonth = foundMonth;
                }
                const yearMatch = name.match(/\b(20\d{2})\b/);
                if (yearMatch) {
                    selectedYear = yearMatch[1];
                } else {
                    const anoMatch = name.match(/Año\s*(\d+)/i);
                    if (anoMatch) {
                        const yearNum = parseInt(anoMatch[1]);
                        selectedYear = String(2025 + yearNum);
                    }
                }
            }
            return { month: selectedMonth, year: selectedYear };
        };

        const getNextMonthAndYear = (contributions) => {
            if (!contributions || contributions.length === 0) {
                const now = new Date();
                const month = monthsList[now.getMonth()];
                const year = String(now.getFullYear());
                return { month, year };
            }
            const lastMonth = contributions[contributions.length - 1];
            const parsed = parseMonthName(lastMonth.name);
            const lastMonthIdx = monthsList.indexOf(parsed.month);
            let nextMonthIdx = lastMonthIdx + 1;
            let nextYear = parseInt(parsed.year);
            if (nextMonthIdx >= 12) {
                nextMonthIdx = 0;
                nextYear += 1;
            }
            return { month: monthsList[nextMonthIdx], year: String(nextYear) };
        };

            const persistData = (updatedContribs, updatedMeta, updatedSaldo, updatedMetas, updatedFurniture, updatedCorr, updatedReason, updatedIntRate, updatedRecDate, updatedEmails, updatedPin, updatedLauraInit, updatedAsierInit, updatedRepaid, updatedTaxRate) => {

            const uploadCurrentDataToFirebase = () => {

                persistData(contributions, metaTotal, saldoInicial, houseMetas, furnitureBudget, revolutCorrection, revolutCorrectionReason, annualInterestRate, reconciliationDate, allowedEmails, familyPin, lauraInitialPayment, asierInitialPayment, repaidToLaura, taxRatePercentage)

            // --- LÓGICA REAJUSTADA DE FINANZAS MÁXIMA PRECISIÓN ---
            const processedData = useMemo(() => {
                let currentAccumulated = saldoInicial;
                let totalLaura = 0;
                let totalAsier = 0;
                let totalSimulacion = saldoInicial;
                let totalPagos = 0;

                const rows = contributions.map((c) => {
                    const totalMes = Number(c.laura) + Number(c.asier);
                    currentAccumulated += totalMes;
                    totalLaura += Number(c.laura);
                    totalAsier += Number(c.asier);
                    totalSimulacion += Number(c.simulacion || 0);
                    totalPagos += Number(c.pagos || 0);

                    const pendiente = Math.max(0, metaTotal - currentAccumulated);
                    const d50_50 = totalLaura - totalAsier;
                    const diferenciaVsPlan = currentAccumulated - totalSimulacion;

                    return {
                        ...c,
                        totalMes,
                        acumulado: currentAccumulated,
                        pendiente,
                        diferencia50_50: d50_50,
                        totalLauraAcumulado: totalLaura,
                        totalAsierAcumulado: totalAsier,
                        simulacionAcumulado: totalSimulacion,
                        diferenciaVsPlan
                    };
                });

                const totalAhorrado = currentAccumulated;
                const porcentajeProgreso = Math.min(100, (totalAhorrado / metaTotal) * 100);
                
                // Base real matemática del último mes
                const lastMonthRevolutBase = contributions.length > 0 ? Number(contributions[contributions.length - 1].revolut) : saldoInicial;

                // CORRECCIÓN SOLICITADA: Suma directa del bote manual sin interferencias de fechas o tasas
                const saldoRevolutActual = lastMonthRevolutBase + revolutCorrection;

                const totalMueblesPresupuesto = furnitureBudget.reduce((sum, item) => sum + item.amount, 0);
                const totalMueblesGastado = furnitureBudget.reduce((sum, item) => sum + item.spent, 0);

                // --- NUEVA LÓGICA DE BALANCE Ledger 50/50 ---
                const totalInicial = lauraInitialPayment + asierInitialPayment;
                const diferenciaInicial = lauraInitialPayment - asierInitialPayment;
                const compensacionInicialIdeal = diferenciaInicial / 2;
                const balanceInicialPendiente = compensacionInicialIdeal - repaidToLaura;

                const totalMensual = totalLaura + totalAsier;
                const diferenciaMensual = totalLaura - totalAsier;
                const compensacionMensualIdeal = diferenciaMensual / 2;

                const totalLauraNeto = lauraInitialPayment + totalLaura - repaidToLaura;
                const totalAsierNeto = asierInitialPayment + totalAsier + repaidToLaura;
                const totalGeneralProyecto = totalInicial + totalMensual;
                const objetivoPorPersona = totalGeneralProyecto / 2;
                const diferenciaNetaGlobal = totalLauraNeto - totalAsierNeto;
                const balanceConsolidado = totalLauraNeto - objetivoPorPersona; // Si > 0, Asier debe a Laura; si < 0, Laura debe a Asier

                return {
                    rows,
                    totalAhorrado,
                    porcentajeProgreso,
                    totalLaura,
                    totalAsier,
                    totalPagos,
                    lastMonthRevolutBase,
                    saldoRevolutActual,
                    totalSimulacion,
                    totalMueblesPresupuesto,
                    totalMueblesGastado,
                    // Variables expuestas para la UI
                    totalInicial,
                    diferenciaInicial,
                    compensacionInicialIdeal,
                    balanceInicialPendiente,
                    totalMensual,
                    diferenciaMensual,
                    compensacionMensualIdeal,
                    totalLauraNeto,
                    totalAsierNeto,
                    totalGeneralProyecto,
                    objetivoPorPersona,
                    diferenciaNetaGlobal,
                    balanceConsolidado
                };
            }, [contributions, metaTotal, saldoInicial, furnitureBudget, revolutCorrection, lauraInitialPayment, asierInitialPayment, repaidToLaura]);

            const projections = useMemo(() => {
                const restanteCasa = Math.max(0, metaTotal - processedData.totalAhorrado);
                const restanteMuebles = Math.max(0, processedData.totalMueblesPresupuesto - processedData.totalMueblesGastado);
                const totalRestanteProyectoCompleto = restanteCasa + restanteMuebles;

                let actualMonthlyVelocity = 2300; 
                if (contributions.length >= 3) {
                    const last3 = contributions.slice(-3);
                    const sum = last3.reduce((s, c) => s + Number(c.laura) + Number(c.asier), 0);

                const mesesParaCasa = Math.ceil(restanteCasa / targetMonthlySaving);
                const mesesParaCompleto = Math.ceil(totalRestanteProyectoCompleto / targetMonthlySaving);

                const hoy = new Date();
                const fechaCasa = new Date(hoy.getFullYear(), hoy.getMonth() + mesesParaCasa, 1);
                const fechaCompleto = new Date(hoy.getFullYear(), hoy.getMonth() + mesesParaCompleto, 1);

                    mesesParaCasa,

            const hipotecaData = useMemo(() => {

                const r = (interestRate / 100) / 12;
                const n = loanTermYears * 12;
                
                let cuotaMensual = 0;
                if (r > 0) {
                    cuotaMensual = (prestamoHipotecario * r * Math.pow(1 + r, n)) / (Math.pow(1 + r, n) - 1);
                } else {
                    cuotaMensual = prestamoHipotecario / n;
                }

                const totalPagado = cuotaMensual * n;
                const totalIntereses = totalPagado - prestamoHipotecario;

                return {
                    valorVivienda,
                    prestamoHipotecario,
                    cuotaMensual,
                    totalPagado,
                    totalIntereses
                };
            }, [interestRate, loanTermYears]);

                        const appIdSlug = firebaseConfig.projectId || 'housecontrol-2bace';
                        dbRef.current.collection('artifacts').doc(appIdSlug).collection('public').doc('data').collection('contributions').doc(id).delete()

                                addNotification("Mes eliminado del histórico", "info");
                            })
                            .catch((err) => {
                                console.error("Error deleting document from Firestore: ", err);
                                addNotification("Error al eliminar de la nube", "error");
                            });
                    } else {
                        setContributions(updated);
                        persistData(updated);
                        addNotification("Mes eliminado del histórico", "info");
                    }
                }
            };

            const addFurnitureItem = () => {
                if (!newFurniture.category || !newFurniture.item || !newFurniture.amount) {
                    addNotification("Completa todos los campos para añadir el mueble", "error");
                    return;
                }
                const newItem = {
                    id: 'f_' + Date.now(),
                    category: newFurniture.category,
                    item: newFurniture.item,
                    amount: Number(newFurniture.amount),
                    spent: 0,
                    status: 'Pendiente',
                    priority: newFurniture.priority
                };
                const updated = [...furnitureBudget, newItem];
                setFurnitureBudget(updated);
                persistData(contributions, metaTotal, saldoInicial, houseMetas, updated);
                setNewFurniture({ category: "", item: "", amount: 0, priority: "Media" });
                addNotification("Partida de mueble añadida con éxito");
            };

            const deleteFurnitureItem = (id) => {
                const updated = furnitureBudget.filter(f => f.id !== id);
                setFurnitureBudget(updated);
                persistData(contributions, metaTotal, saldoInicial, houseMetas, updated);
                addNotification("Partida presupuestaria eliminada");
            };

            const toggleFurnitureStatus = (id) => {
                const updated = furnitureBudget.map(f => {
                    if (f.id === id) {
                        const newStatus = f.status === 'Comprado' ? 'Pendiente' : 'Comprado';
                        return {
                            ...f,
                            status: newStatus,
                            spent: newStatus === 'Comprado' ? f.amount : 0
                        };
                    }
                    return f;

                setFurnitureBudget(updated);
                persistData(contributions, metaTotal, saldoInicial, houseMetas, updated);

                e.preventDefault();
                localStorage.setItem('casa_firebase_config', JSON.stringify(firebaseConfigForm));
                setFirebaseConfig(firebaseConfigForm);
                connectFirebase(firebaseConfigForm);
            };

            const handleCSVUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    parseCSVData(event.target.result);
                };
                reader.readAsText(file);
            };

            const parseCSVData = (text) => {
                try {
                    const lines = text.split('\n');
                    let parsedMeta = DEFAULT_META_TOTAL;
                    let parsedSaldo = DEFAULT_SALDO_INICIAL;
                    let parsedMetas = [...DEFAULT_METAS];
                    const parsedMonthly = [];

                    lines.forEach(line => {
                        const cols = line.split(',');
                        if (cols.length < 2) return;

                        const cleanText = (str) => str ? str.trim().replace(/"/g, '') : '';
                        const cleanNum = (str) => {
                            if (!str) return 0;
                            let val = str.trim().replace(/"/g, '').replace('€', '').replace(/\s/g, '');
                            if (val.includes('.') && val.includes(',')) {
                                val = val.replace(/\./g, '').replace(',', '.');
                            } else if (val.includes(',')) {
                                val = val.replace(',', '.');
                            }
                            return parseFloat(val) || 0;
                        };

                        const label = cleanText(cols[1]);
                        const val = cols[2];

                        if (label.includes("10% Entrada Piso")) parsedMetas[0].amount = cleanNum(val);
                        else if (label.includes("IVA (Gastos)")) parsedMetas[1].amount = cleanNum(val);
                        else if (label.includes("Personalización")) parsedMetas[2].amount = cleanNum(val);
                        else if (label.includes("META TOTAL")) parsedMeta = cleanNum(val);
                        else if (label.includes("Saldo Inicial Real")) parsedSaldo = cleanNum(val);

                        const idx = parseInt(cols[0]);
                        if (!isNaN(idx) && idx > 0 && cols.length >= 6) {
                            parsedMonthly.push({
                                id: 'm_imported_' + idx + '_' + Date.now(),
                                name: cleanText(cols[1]),
                                laura: cleanNum(cols[2]),
                                asier: cleanNum(cols[3]),
                                revolut: cleanNum(cols[5]),
                                simulacion: cleanNum(cols[11]) || cleanNum(cols[4])
                            });
                        }
                    });

                    if (parsedMonthly.length > 0) {
                        setMetaTotal(parsedMeta);
                        setSaldoInicial(parsedSaldo);
                        setHouseMetas(parsedMetas);
                        setContributions(parsedMonthly);
                        persistData(parsedMonthly, parsedMeta, parsedSaldo, parsedMetas);
                        addNotification("Carga de CSV completada", "success");
                    }
                } catch (err) {
                    addNotification("Error procesando CSV", "error");
                }
            };

        function ResponsiveSVGChart({ rows, metaTotal }) {
            if (!rows || rows.length === 0) return null;

            const [isMobile, setIsMobile] = React.useState(window.innerWidth < 768);
            const [activePoint, setActivePoint] = React.useState(null); // { index, x, y, simY, val, simVal, name }
            const svgRef = React.useRef(null);

            React.useEffect(() => {
                const handleResize = () => {
                    setIsMobile(window.innerWidth < 768);
                };
                window.addEventListener('resize', handleResize);
                return () => window.removeEventListener('resize', handleResize);
            }, []);

            const width = isMobile ? 400 : 600;
            const height = isMobile ? 220 : 180;
            const padding = isMobile ? 35 : 30;

            const maxVal = Math.max(...rows.map(r => Math.max(r.acumulado, r.simulacionAcumulado, metaTotal))) * 1.1;
            const minVal = 0;

            const pointsReal = rows.map((r, i) => {
                const x = padding + (i / (rows.length - 1)) * (width - padding * 2);
                const y = height - padding - ((r.acumulado - minVal) / (maxVal - minVal)) * (height - padding * 2);
                return { x, y, val: r.acumulado, name: r.name };
            });

            const pointsSim = rows.map((r, i) => {
                const x = padding + (i / (rows.length - 1)) * (width - padding * 2);
                const y = height - padding - ((r.simulacionAcumulado - minVal) / (maxVal - minVal)) * (height - padding * 2);
                return { x, y, val: r.simulacionAcumulado };
            });

            React.useEffect(() => {
                const handleClickOutside = (e) => {
                    if (svgRef.current && !svgRef.current.contains(e.target)) {
                        setActivePoint(null);
                    }
                };
                document.addEventListener('click', handleClickOutside);
                document.addEventListener('touchstart', handleClickOutside);
                return () => {
                    document.removeEventListener('click', handleClickOutside);
                    document.removeEventListener('touchstart', handleClickOutside);
                };
            }, []);

            const handleInteraction = (e) => {
                if (!svgRef.current) return;
                const rect = svgRef.current.getBoundingClientRect();
                if (rect.width === 0) return;

                let clientX;
                if (e.touches && e.touches.length > 0) {
                    // Prevent page scroll only if they are actively dragging/sliding inside the chart area
                    if (e.type === 'touchmove') {
                        // Allow vertical scroll if it's mostly vertical, but prevent if sliding horizontally on the chart
                    }
                    clientX = e.touches[0].clientX;
                } else if (e.clientX !== undefined) {
                    clientX = e.clientX;
                } else {
                    return;
                }

                const xInSvg = ((clientX - rect.left) / rect.width) * width;

                // Find closest point index
                let closestIdx = 0;
                let minDistance = Infinity;
                pointsReal.forEach((p, idx) => {
                    const dist = Math.abs(p.x - xInSvg);
                    if (dist < minDistance) {
                        minDistance = dist;
                        closestIdx = idx;
                    }
                });

                const p = pointsReal[closestIdx];
                const simPoint = pointsSim[closestIdx];

                setActivePoint({
                    index: closestIdx,
                    x: p.x,
                    y: p.y,
                    simY: simPoint.y,
                    val: p.val,
                    simVal: simPoint.val,
                    name: p.name
                });
            };

            const pathRealD = pointsReal.map((p, i) => `${i === 0 ? 'M' : 'L'} ${p.x} ${p.y}`).join(' ');
            const pathSimD = pointsSim.map((p, i) => `${i === 0 ? 'M' : 'L'} ${p.x} ${p.y}`).join(' ');

            const areaRealD = `${pathRealD} L ${pointsReal[pointsReal.length - 1].x} ${height - padding} L ${pointsReal[0].x} ${height - padding} Z`;

            // Calculate tooltip dynamic position so it doesn't clip
            const tooltipY = activePoint ? (activePoint.y > height / 2 ? activePoint.y - 75 : activePoint.y + 15) : 0;

            return (
                <div className="relative w-full">
                    <svg 
                        ref={svgRef}
                        viewBox={`0 0 ${width} ${height}`} 
                        className="w-full h-auto text-slate-700 select-none touch-pan-y cursor-pointer"
                        style={{ touchAction: 'pan-y' }}
                        onMouseMove={handleInteraction}
                        onMouseLeave={() => setActivePoint(null)}
                        onTouchStart={handleInteraction}
                        onTouchMove={handleInteraction}
                        onClick={handleInteraction}
                    >
                        <defs>
                            <linearGradient id="realGradient" x1="0" y1="0" x2="0" y2="1">
                                <stop offset="0%" stopColor="#0ea5e9" />
                                <stop offset="100%" stopColor="transparent" />
                            </linearGradient>
                        </defs>
                        {[0, 0.25, 0.5, 0.75, 1].map((ratio, idx) => {
                            const y = padding + ratio * (height - padding * 2);
                            const valLabel = Math.round(maxVal - ratio * (maxVal - minVal));
                            return (
                                <g key={idx}>
                                    <line x1={padding} y1={y} x2={width - padding} y2={y} stroke="rgba(51, 65, 85, 0.15)" strokeWidth="1" />
                                    <text x={padding - 5} y={y + 3} fill="#475569" fontSize={isMobile ? "9" : "8"} fontWeight="bold" textAnchor="end">
                                        {valLabel.toLocaleString('es-ES')}
                                    </text>
                                </g>
                            );
                        })}

                        <path d={areaRealD} fill="url(#realGradient)" opacity="0.12" />
                        <path d={pathSimD} fill="none" stroke="#6366f1" strokeWidth={isMobile ? "2.5" : "2"} strokeDasharray="3,3" />
                        <path d={pathRealD} fill="none" stroke="#0ea5e9" strokeWidth={isMobile ? "4" : "3"} strokeLinecap="round" />

                        {pointsReal.map((p, i) => {
                            const isCurrentlyActive = activePoint && activePoint.index === i;
                            return (
                                <g key={i} className="pointer-events-none">
                                    <circle 
                                        cx={p.x} 
                                        cy={p.y} 
                                        r={isCurrentlyActive ? (isMobile ? "6" : "5") : (isMobile ? "4" : "3")} 
                                        fill="#0ea5e9" 
                                        stroke={isCurrentlyActive ? "#ffffff" : "#0f172a"} 
                                        strokeWidth={isCurrentlyActive ? "2" : "1.5"} 
                                        className="transition-all duration-200"
                                    />
                                </g>
                            );
                        })}

                        {pointsReal.filter((_, idx) => idx % 2 === 0).map((p, idx) => (
                            <text key={idx} x={p.x} y={height - (isMobile ? 12 : 8)} fill="#64748b" fontSize={isMobile ? "9" : "8"} fontWeight="bold" textAnchor="middle">
                                {p.name.split(' ')[0]}
                            </text>
                        ))}

                        {/* RENDERIZADO DEL TOOLTIP FLOTANTE INTERACTIVO */}
                        {activePoint && (
                            <g pointerEvents="none">
                                {/* Vertical guideline */}
                                <line 
                                    x1={activePoint.x} 
                                    y1={padding} 
                                    x2={activePoint.x} 
                                    y2={height - padding} 
                                    stroke="#0ea5e9" 
                                    strokeWidth="1.5" 
                                    strokeDasharray="3,3" 
                                    opacity="0.4"
                                />
                                {/* Circle highlight on simulation point */}
                                <circle cx={activePoint.x} cy={activePoint.simY} r="5" fill="#6366f1" stroke="#ffffff" strokeWidth="1.5" />
                                
                                {/* Tooltip Popover Box */}
                                <g transform={`translate(${Math.max(10, Math.min(width - 130, activePoint.x - 60))}, ${tooltipY})`}>
                                    <rect 
                                        width="120" 
                                        height="62" 
                                        rx="10" 
                                        fill="#0f172a" 
                                        stroke="#1e293b" 
                                        strokeWidth="1" 
                                        opacity="0.95"
                                    />
                                    {/* Month Name */}
                                    <text x="60" y="14" fill="#ffffff" fontSize="8" fontWeight="bold" textAnchor="middle">
                                        {activePoint.name}
                                    </text>
                                    {/* Real Value */}
                                    <text x="10" y="28" fill="#38bdf8" fontSize="8" fontWeight="bold">
                                        Real:
                                    </text>
                                    <text x="110" y="28" fill="#ffffff" fontSize="8" fontWeight="bold" textAnchor="end">
                                        {Math.round(activePoint.val).toLocaleString('es-ES')} €
                                    </text>
                                    {/* Sim Value */}
                                    <text x="10" y="40" fill="#818cf8" fontSize="8" fontWeight="bold">
                                        Simulado:
                                    </text>
                                    <text x="110" y="40" fill="#cbd5e1" fontSize="8" fontWeight="semibold" textAnchor="end">
                                        {Math.round(activePoint.simVal).toLocaleString('es-ES')} €
                                    </text>
                                    {/* Difference */}
                                    <text x="10" y="52" fill="#94a3b8" fontSize="7" fontWeight="bold">
                                        Desviación:
                                    </text>
                                    <text 
                                        x="110" 
                                        y="52" 
                                        fill={activePoint.val >= activePoint.simVal ? "#10b981" : "#ef4444"} 
                                        fontSize="7" 
                                        fontWeight="bold" 
                                        textAnchor="end"
                                    >
                                        {activePoint.val >= activePoint.simVal ? "+" : ""}
                                        {Math.round(activePoint.val - activePoint.simVal).toLocaleString('es-ES')} €
                                    </text>
                                </g>
                            </g>
                        )}
                    </svg>
                </div>
            );
        }

        function BalanceDonutChart({ lauraValue, asierValue, nameLaura = "Laura", nameAsier = "Asier" }) {
            const [chartState, setChartState] = React.useState('current'); // 'current' | 'balanced'
            const [hoveredSlice, setHoveredSlice] = React.useState(null); // 'laura' | 'asier' | null

            const isBalanced = chartState === 'balanced';
            
            // Values to draw
            const total = lauraValue + asierValue;
            const drawLaura = isBalanced ? total / 2 : lauraValue;
            const drawAsier = isBalanced ? total / 2 : asierValue;
            
            const pctLaura = total > 0 ? (drawLaura / total) * 100 : 50;
            const pctAsier = total > 0 ? (drawAsier / total) * 100 : 50;

            const size = 180;
            const center = size / 2;
            const radius = 62;
            const strokeWidth = 14;
            const circumference = 2 * Math.PI * radius;

            const strokeDashoffsetLaura = circumference - (pctLaura / 100) * circumference;
            const rotateLaura = -90; // Start at the top (12 o'clock)
            const rotateAsier = -90 + (pctLaura / 100) * 360;

            // Detect touch capabilities
            const isTouch = typeof window !== 'undefined' && ('ontouchstart' in window || navigator.maxTouchPoints > 0);

            // Labels to display in the middle of donut
            let activeLabel = "Aportado Neto";
            let activeValue = `${total.toLocaleString('es-ES')} €`;
            if (isBalanced) {
                activeLabel = "Estado Equilibrado";
                activeValue = `${(total / 2).toLocaleString('es-ES')} € c/u`;
                if (hoveredSlice === 'laura') {
                    activeLabel = `${nameLaura} (Ideal)`;
                } else if (hoveredSlice === 'asier') {
                    activeLabel = `${nameAsier} (Ideal)`;
                }
            } else {
                if (hoveredSlice === 'laura') {
                    activeLabel = `${nameLaura}: ${((lauraValue / (total || 1)) * 100).toFixed(1)}%`;
                    activeValue = `${lauraValue.toLocaleString('es-ES')} €`;
                } else if (hoveredSlice === 'asier') {
                    activeLabel = `${nameAsier}: ${((asierValue / (total || 1)) * 100).toFixed(1)}%`;
                    activeValue = `${asierValue.toLocaleString('es-ES')} €`;
                }
            }

            let promptText = "Pasa el cursor";
            if (isBalanced) {
                promptText = "Equilibrio (50/50)";
            } else if (hoveredSlice) {
                promptText = isTouch ? "Toca para limpiar" : "Detalle";
            } else {
                promptText = isTouch ? "Toca un sector" : "Pasa el cursor";
            }

            return (
                <div 
                    onClick={() => setHoveredSlice(null)}
                    className="flex flex-col items-center justify-center p-5 bg-slate-950/60 rounded-3xl border border-slate-800/80 shadow-xl space-y-4 h-full relative overflow-hidden group cursor-pointer"
                >
                    <div className="flex justify-between items-center w-full" onClick={(e) => e.stopPropagation()}>
                        <span className="text-[10px] uppercase font-black tracking-wider text-slate-400">Distribución Real</span>
                        <div className="bg-slate-900 p-0.5 rounded-lg flex border border-slate-800">
                            <button
                                onClick={(e) => { e.stopPropagation(); setChartState('current'); }}
                                className={`px-2 py-1 rounded text-[8px] font-black uppercase tracking-wider transition ${chartState === 'current' ? 'bg-indigo-600 text-white' : 'text-slate-500 hover:text-slate-350'}`}
                            >
                                Actual
                            </button>
                            <button
                                onClick={(e) => { e.stopPropagation(); setChartState('balanced'); }}
                                className={`px-2 py-1 rounded text-[8px] font-black uppercase tracking-wider transition ${chartState === 'balanced' ? 'bg-indigo-600 text-white' : 'text-slate-500 hover:text-slate-350'}`}
                            >
                                Ideal
                            </button>
                        </div>
                    </div>

                    <div className="relative w-40 h-40 flex items-center justify-center">
                        <svg width="100%" height="100%" viewBox={`0 0 ${size} ${size}`} className="transform -rotate-90">
                            {/* Background track */}
                            <circle
                                cx={center}
                                cy={center}
                                r={radius}
                                fill="transparent"
                                stroke="#1e293b"
                                strokeWidth={strokeWidth}
                            />
                            {/* Laura's slice (Pink) */}
                            <circle
                                cx={center}
                                cy={center}
                                r={radius}
                                fill="transparent"
                                stroke="#ec4899"
                                strokeWidth={hoveredSlice === 'laura' ? strokeWidth + 4 : strokeWidth}
                                opacity={hoveredSlice === 'asier' ? 0.35 : 1}
                                strokeDasharray={circumference}
                                strokeDashoffset={strokeDashoffsetLaura}
                                strokeLinecap="round"
                                transform={`rotate(${rotateLaura} ${center} ${center})`}
                                className="transition-all duration-300 cursor-pointer origin-center hover:scale-102"
                                style={{ transition: 'all 0.3s ease-in-out' }}
                                onPointerEnter={(e) => { if (e.pointerType !== 'touch') setHoveredSlice('laura'); }}
                                onPointerLeave={(e) => { if (e.pointerType !== 'touch') setHoveredSlice(null); }}
                                onClick={(e) => {
                                    e.stopPropagation();
                                    setHoveredSlice(hoveredSlice === 'laura' ? null : 'laura');
                                }}
                            />
                            {/* Asier's slice (Blue) */}
                            <circle
                                cx={center}
                                cy={center}
                                r={radius}
                                fill="transparent"
                                stroke="#3b82f6"
                                strokeWidth={hoveredSlice === 'asier' ? strokeWidth + 4 : strokeWidth}
                                opacity={hoveredSlice === 'laura' ? 0.35 : 1}
                                strokeDasharray={circumference}
                                strokeDashoffset={circumference - (pctAsier / 100) * circumference}
                                strokeLinecap="round"
                                transform={`rotate(${rotateAsier} ${center} ${center})`}
                                className="transition-all duration-300 cursor-pointer origin-center hover:scale-102"
                                style={{ transition: 'all 0.3s ease-in-out' }}
                                onPointerEnter={(e) => { if (e.pointerType !== 'touch') setHoveredSlice('asier'); }}
                                onPointerLeave={(e) => { if (e.pointerType !== 'touch') setHoveredSlice(null); }}
                                onClick={(e) => {
                                    e.stopPropagation();
                                    setHoveredSlice(hoveredSlice === 'asier' ? null : 'asier');
                                }}
                            />
                        </svg>

                        {/* Text center */}
                        <div className="absolute inset-0 flex flex-col items-center justify-center text-center pointer-events-none select-none">
                            <span className="text-[8px] uppercase font-black text-slate-500 tracking-widest leading-none mb-1.5 px-2 truncate max-w-full">
                                {activeLabel}
                            </span>
                            <span className="text-base font-black text-white leading-none tracking-tight">
                                {activeValue}
                            </span>
                            <span className="text-[7px] text-slate-500 font-bold mt-1 opacity-70">
                                {promptText}
                            </span>
                        </div>
                    </div>

                    <div className="w-full flex justify-around text-[9px] font-bold border-t border-slate-900 pt-3" onClick={(e) => e.stopPropagation()}>
                        <div className="flex flex-col items-center cursor-pointer" onClick={() => setHoveredSlice(hoveredSlice === 'laura' ? null : 'laura')}>
                            <span className="flex items-center gap-1 text-pink-400">
                                <span className={`w-1.5 h-1.5 rounded-full bg-pink-500 transition-all ${hoveredSlice === 'laura' ? 'scale-150' : ''}`}></span>
                                {nameLaura}
                            </span>
                            <span className="text-white mt-0.5">{lauraValue.toLocaleString('es-ES')} €</span>
                            <span className="text-[8px] text-slate-500 font-semibold">{((lauraValue / (total || 1)) * 100).toFixed(0)}% real</span>
                        </div>
                        <div className="flex flex-col items-center cursor-pointer" onClick={() => setHoveredSlice(hoveredSlice === 'asier' ? null : 'asier')}>
                            <span className="flex items-center gap-1 text-blue-400">
                                <span className={`w-1.5 h-1.5 rounded-full bg-blue-500 transition-all ${hoveredSlice === 'asier' ? 'scale-150' : ''}`}></span>
                                {nameAsier}
                            </span>
                            <span className="text-white mt-0.5">{asierValue.toLocaleString('es-ES')} €</span>
                            <span className="text-[8px] text-slate-500 font-semibold">{((asierValue / (total || 1)) * 100).toFixed(0)}% real</span>
                        </div>
                    </div>
                </div>
            );
        }

        function ProjectTimeline({ contributions, processedData, targetSaving, metaTotal, houseMetas, saldoInicial }) {
            const totalMuebles = processedData.totalMueblesPresupuesto - processedData.totalMueblesGastado;

            const lastMonthIndex = contributions.length;
            const lastMonthAccumulated = processedData.totalAhorrado;

            const calculateMonthProjection = (targetAmount) => {
                if (targetAmount <= lastMonthAccumulated) {
                    let sum = saldoInicial;
                    for (let i = 0; i < contributions.length; i++) {
                        sum += Number(contributions[i].laura) + Number(contributions[i].asier);
                        if (sum >= targetAmount) {
                            return i + 1; 
                        }
                    }
                    return 1;
                } else {
                    const remaining = targetAmount - lastMonthAccumulated;
                    const additional = Math.ceil(remaining / targetSaving);
                    return lastMonthIndex + additional;
                }
            };

            // Waterfall savings distribution:
            let remainingSavings = lastMonthAccumulated;

            const targetEntrada = houseMetas && houseMetas[0] ? houseMetas[0].amount : 34870;
            const savedEntrada = Math.min(remainingSavings, targetEntrada);
            remainingSavings = Math.max(0, remainingSavings - savedEntrada);
            const pctEntrada = (savedEntrada / targetEntrada) * 100;

            const targetIVA = houseMetas && houseMetas[1] ? houseMetas[1].amount : 27896;
            const savedIVA = Math.min(remainingSavings, targetIVA);
            remainingSavings = Math.max(0, remainingSavings - savedIVA);
            const pctIVA = (savedIVA / targetIVA) * 100;

            const targetPers = houseMetas && houseMetas[2] ? houseMetas[2].amount : 3863.20;
            const savedPers = Math.min(remainingSavings, targetPers);
            remainingSavings = Math.max(0, remainingSavings - savedPers);
            const pctPers = (savedPers / targetPers) * 100;

            const targetMuebles = totalMuebles;
            const savedMuebles = targetMuebles > 0 ? Math.min(remainingSavings, targetMuebles) : 0;
            remainingSavings = Math.max(0, remainingSavings - savedMuebles);
            const pctMuebles = targetMuebles > 0 ? (savedMuebles / targetMuebles) * 100 : 0;

            const indexEntrada = calculateMonthProjection(targetEntrada);
            const indexIVA = calculateMonthProjection(targetEntrada + targetIVA);
            const indexPersonalizacion = calculateMonthProjection(targetEntrada + targetIVA + targetPers);
            const indexMuebles = calculateMonthProjection(targetEntrada + targetIVA + targetPers + totalMuebles);

            const getMonthLabel = (idx) => {
                const date = new Date(2026, 2, 1); 
                date.setMonth(date.getMonth() + (idx - 1));
                return date.toLocaleDateString('es-ES', { month: 'short', year: '2-digit' }).toUpperCase();
            };

            const getMonthFullLabel = (idx) => {
                const date = new Date(2026, 2, 1);
                date.setMonth(date.getMonth() + (idx - 1));
                return date.toLocaleDateString('es-ES', { month: 'long', year: 'numeric' });
            };

            const mapIndexToPercentage = (idx) => {
                return Math.max(0, Math.min(100, ((idx - 1) / 30) * 100));
            };

            const todayPercentage = 11.0; 

            const timelineMilestones = [
                {
                    id: 'entrada',
                    label: '10% Segunda Entrada',
                    amount: '34.870 €',
                    index: indexEntrada,
                    color: 'text-cyan-400',
                    bgColor: 'bg-cyan-500',
                    borderColor: 'border-cyan-500',
                    isPast: indexEntrada <= 4, 
                    deadlineOk: indexEntrada <= 31
                },
                {
                    id: 'iva',
                    label: 'IVA & Gastos de Escritura',
                    amount: '27.896 €',
                    index: indexIVA,
                    color: 'text-purple-400',
                    bgColor: 'bg-purple-500',
                    borderColor: 'border-purple-500',
                    isPast: indexIVA <= 4,
                    deadlineOk: indexIVA <= 31
                },
                {
                    id: 'pers',
                    label: 'Personalización',
                    amount: '3.863 €',
                    index: indexPersonalizacion,
                    color: 'text-brand-400',
                    bgColor: 'bg-brand-500',
                    borderColor: 'border-brand-500',
                    isPast: indexPersonalizacion <= 4,
                    deadlineOk: indexPersonalizacion <= 31
                },
                {
                    id: 'muebles',
                    label: 'Muebles Completos',
                    amount: `${totalMuebles.toLocaleString('es-ES')} €`,
                    index: indexMuebles,
                    color: 'text-pink-400',
                    bgColor: 'bg-pink-500',
                    borderColor: 'border-pink-500',
                    isPast: indexMuebles <= 4,
                    deadlineOk: indexMuebles <= 31
                }
            ];

            return (
                <div className="space-y-8 py-6 px-4">
                    <div className="relative w-full h-12 flex items-center">
                        <div className="absolute w-full h-1.5 bg-slate-800 rounded-full"></div>
                        <div className="absolute h-1.5 bg-gradient-to-r from-cyan-600 to-indigo-500 rounded-full" style={{ width: `${todayPercentage}%` }}></div>

                        <div className="absolute -translate-x-1/2 -top-1 z-30 flex flex-col items-center" style={{ left: `${todayPercentage}%` }}>
                            <div className="bg-indigo-600 text-white font-extrabold text-[9px] px-2 py-0.5 rounded-md mb-1 shadow-lg whitespace-nowrap animate-bounce uppercase">
                                ¡Estáis aquí!
                            </div>
                            <div className="relative">
                                <span className="absolute -inset-1 rounded-full bg-cyan-500/30 glowing-ring"></span>
                                <svg className="w-6 h-6 text-yellow-400 drop-shadow" viewBox="0 0 24 24" fill="currentColor">
                                    <circle cx="12" cy="8" r="4" fill="#fbbf24" />
                                    <path d="M12 2a4 4 0 0 1 4 4h-8a4 4 0 0 1 4-4z" fill="#f59e0b" />
                                    <path d="M12 14c-4.418 0-8 2.239-8 5v3h16v-3c0-2.761-3.582-5-8-5z" fill="#38bdf8" />
                                </svg>
                            </div>
                        </div>

                        {timelineMilestones.map((milestone) => {
                            const pct = mapIndexToPercentage(milestone.index);
                            const onTime = milestone.deadlineOk;
                            return (
                                <div key={milestone.id} className="absolute -translate-x-1/2 flex flex-col items-center z-10" style={{ left: `${pct}%` }}>
                                    <div className={`w-4 h-4 rounded-full border-2 bg-slate-950 flex items-center justify-center transition-all ${
                                        milestone.isPast ? 'border-emerald-500 bg-emerald-500/10' :
                                        onTime ? 'border-cyan-500 bg-cyan-500/10' : 'border-rose-500 bg-rose-500/10'
                                    }`}>
                                        <span className={`w-1.5 h-1.5 rounded-full ${milestone.isPast ? 'bg-emerald-400' : onTime ? 'bg-cyan-400' : 'bg-rose-500 animate-ping'}`}></span>
                                    </div>
                                    <span className="text-[9px] font-black text-slate-400 mt-2 bg-slate-900 px-1 py-0.5 rounded border border-slate-800">
                                        {getMonthLabel(milestone.index)}
                                    </span>
                                </div>
                            );
                        })}

                        <div className="absolute right-0 -translate-x-1/2 flex flex-col items-center z-20">
                            <div className="w-5 h-5 rounded-lg bg-indigo-600 flex items-center justify-center text-white border border-indigo-500 shadow-md">
                                🗝️
                            </div>
                            <span className="text-[9px] font-black text-indigo-400 mt-2 bg-indigo-950/60 px-1 py-0.5 rounded border border-indigo-800/40">
                                SEP 28
                            </span>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mt-8 pt-4">
                        {timelineMilestones.map((m) => {
                            const onTime = m.deadlineOk;
                            const isFinished = m.isPast;

                            let saved = 0;
                            let target = 0;
                            let pct = 0;
                            let statusText = '';

                            if (m.id === 'entrada') {
                                saved = savedEntrada;
                                target = targetEntrada;
                                pct = pctEntrada;
                            } else if (m.id === 'iva') {
                                saved = savedIVA;
                                target = targetIVA;
                                pct = pctIVA;
                            } else if (m.id === 'pers') {
                                saved = savedPers;
                                target = targetPers;
                                pct = pctPers;
                            } else if (m.id === 'muebles') {
                                saved = savedMuebles;
                                target = targetMuebles;
                                pct = pctMuebles;
                            }

                            if (pct >= 100) {
                                statusText = '¡ALCANZADO!';
                            } else if (pct > 0) {
                                statusText = 'Llenándose...';
                            } else {
                                statusText = 'En espera';
                            }

                            return (
                                <div key={m.id} className={`p-4 rounded-2xl border transition ${
                                    pct >= 100 ? 'bg-emerald-950/10 border-emerald-500/20' :
                                    pct > 0 ? 'bg-cyan-950/10 border-cyan-500/20' : 'bg-slate-900/60 border-slate-800/80'
                                }`}>
                                    <div className="flex items-start justify-between">
                                        <div className="space-y-1">
                                            <h4 className="text-xs font-black text-white uppercase tracking-wider">{m.label}</h4>
                                            <p className="text-[10px] text-slate-400">Objetivo de esta parte: <strong className="text-white">{target.toLocaleString('es-ES', { maximumFractionDigits: 2 })} €</strong></p>
                                        </div>
                                        <span className={`text-[9px] font-bold px-2 py-0.5 rounded-full ${
                                            pct >= 100 ? 'bg-emerald-500/10 text-emerald-400' :
                                            pct > 0 ? 'bg-cyan-500/10 text-cyan-400' : 'bg-slate-800 text-slate-400'
                                        }`}>
                                            {statusText}
                                        </span>
                                    </div>
                                    
                                    <div className="mt-3 space-y-1.5">
                                        <div className="flex justify-between text-[10px] font-bold">
                                            <span className="text-slate-400">Ahorrado: <strong className="text-white">{saved.toLocaleString('es-ES', { maximumFractionDigits: 2 })} €</strong></span>
                                            <span className={pct >= 100 ? 'text-emerald-400' : pct > 0 ? 'text-cyan-400' : 'text-slate-500'}>{pct.toFixed(1)}%</span>
                                        </div>
                                        <div className="w-full h-1.5 bg-slate-950 rounded-full overflow-hidden border border-slate-900">
                                            <div className={`h-full rounded-full transition-all duration-500 ${
                                                pct >= 100 ? 'bg-emerald-500' : 'bg-cyan-500'
                                            }`} style={{ width: `${pct}%` }}></div>
                                        </div>
                                    </div>
                                    
                                    <div className="mt-4 flex items-center justify-between text-xs border-t border-slate-900/60 pt-3">
                                        <span className="text-slate-400">Fecha proyectada:</span>
                                        <strong className="text-white font-extrabold">{getMonthFullLabel(m.index)}</strong>
                                    </div>
                                    
                                    <div className="mt-2 text-[10px] text-slate-500 leading-relaxed">
                                        {isFinished ? (
                                            `Ya acumulasteis la cantidad correspondiente de este hito con las aportaciones registradas.`
                                        ) : onTime ? (
                                            `Llegaréis con holgura de ${31 - m.index} meses antes del límite de firma.`
                                        ) : (
                                            `Al ritmo de ahorro fijado (€${targetSaving}/mes), este hito se retrasará hasta después del límite.`
                                        )}
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        }

        // Renderizado clásico directo inmune al fallo de jsx-runtime
        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(React.createElement(App));
    </script>
</body>
</html>
